<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aluar · Redes Sociales</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid-line:      #e1e0d9;
    --axis-line:      #c3c2b7;
    --border-hair:    rgba(11,11,11,0.10);
    --success:        #006300;
    --danger:         #d03b3b;
    --series-ig:      #2a78d6; /* blue   */
    --series-li:      #008300; /* green  */
    --series-yt:      #e87ba4; /* magenta*/
    --series-1:       #2a78d6;
    --shadow-card:    0 1px 2px rgba(11,11,11,0.05), 0 2px 10px rgba(11,11,11,0.05);
    --shadow-sticky:  0 2px 10px rgba(11,11,11,0.07);
    --surface-2:      #f1f0ea;
    --cat-1: #2a78d6; --cat-2: #008300; --cat-3: #e87ba4; --cat-4: #eda100; --cat-5: #1baf7a; --cat-6: #898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid-line:      #2c2c2a;
      --axis-line:      #383835;
      --border-hair:    rgba(255,255,255,0.10);
      --success:        #0ca30c;
      --danger:         #e66767;
      --series-ig:      #3987e5;
      --series-li:      #008300;
      --series-yt:      #d55181;
      --series-1:       #3987e5;
      --shadow-card:    0 1px 2px rgba(0,0,0,0.35), 0 2px 10px rgba(0,0,0,0.28);
      --shadow-sticky:  0 2px 12px rgba(0,0,0,0.35);
      --surface-2:      #242422;
      --cat-1: #3987e5; --cat-2: #008300; --cat-3: #d55181; --cat-4: #c98500; --cat-5: #199e70; --cat-6: #898781;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid-line:      #2c2c2a;
    --axis-line:      #383835;
    --border-hair:    rgba(255,255,255,0.10);
    --success:        #0ca30c;
    --danger:         #e66767;
    --series-ig:      #3987e5;
    --series-li:      #008300;
    --series-yt:      #d55181;
    --series-1:       #3987e5;
    --shadow-card:    0 1px 2px rgba(0,0,0,0.35), 0 2px 10px rgba(0,0,0,0.28);
    --shadow-sticky:  0 2px 12px rgba(0,0,0,0.35);
    --surface-2:      #242422;
    --cat-1: #3987e5; --cat-2: #008300; --cat-3: #d55181; --cat-4: #c98500; --cat-5: #199e70; --cat-6: #898781;
  }

  * { box-sizing: border-box; }
  .viz-root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
    min-height: 100%;
    padding: 20px 20px 48px;
  }
  .page { max-width: 1180px; margin: 0 auto; }

  .header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .header .brand { display: flex; align-items: center; gap: 14px; }
  .header .logo { height: 52px; width: auto; display: block; flex-shrink: 0; }
  .header h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
  .header .sub { color: var(--text-secondary); font-size: 13px; }
  .header .meta { text-align: right; font-size: 12px; color: var(--text-muted); }

  .controls-sticky {
    position: sticky; top: 0; z-index: 20; background: var(--page-plane);
    padding-top: 4px; margin: 0 -20px; padding-left: 20px; padding-right: 20px;
    box-shadow: var(--shadow-sticky);
  }

  .bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: var(--surface-1); border: 1px solid var(--border-hair);
    border-radius: 10px; padding: 8px 10px; margin-bottom: 14px;
    box-shadow: var(--shadow-card);
  }
  .bar .grp { display:flex; gap:6px; flex-wrap: wrap; }
  button.chip {
    font: inherit; font-size: 12.5px; cursor: pointer; color: var(--text-secondary);
    background: transparent; border: 1px solid var(--border-hair); border-radius: 999px;
    padding: 5px 12px; white-space: nowrap;
  }
  button.chip:hover { background: var(--grid-line); }
  button.chip.active { background: var(--series-1); color: #fff; border-color: var(--series-1); font-weight: 600; }
  .bar input[type=date] {
    font: inherit; font-size: 12.5px; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border-hair); border-radius: 6px; padding: 4px 6px;
  }
  .bar .sep { width: 1px; align-self: stretch; background: var(--border-hair); margin: 0 4px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 0; padding-bottom: 12px; border-bottom: 1px solid var(--border-hair); }
  .tabs button {
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    background: transparent; border: none; color: var(--text-secondary);
    padding: 9px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button.active { color: var(--text-primary); border-bottom-color: var(--series-1); }

  main#content { margin-top: 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border-hair); border-radius: 10px;
    padding: 12px 14px; box-shadow: var(--shadow-card);
    border-left: 3px solid var(--tile-accent, transparent);
  }
  .tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .value { font-size: 24px; font-weight: 600; line-height: 1.1; }
  .tile .delta { font-size: 12px; margin-top: 5px; font-weight: 600; }
  .tile .delta.up { color: var(--success); }
  .tile .delta.down { color: var(--danger); }
  .tile .delta.flat { color: var(--text-muted); }

  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .cards.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cards .card.wide { grid-column: 1 / -1; }
  @media (max-width: 700px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface-1); border: 1px solid var(--border-hair); border-radius: 10px;
    padding: 14px 16px 8px; overflow: hidden; box-shadow: var(--shadow-card);
  }
  .card h3 { font-size: 13.5px; margin: 0 0 2px; font-weight: 600; }
  .card .cap { font-size: 11.5px; color: var(--text-muted); margin-bottom: 6px; }
  .card .toggle {
    float: right; font-size: 11px; color: var(--text-secondary); cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px; background:none; border:none; font-family:inherit;
  }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); margin: 2px 0 6px; flex-wrap: wrap; }
  .legend .key { display: inline-flex; align-items: center; gap: 5px; }
  .legend .swatch { width: 14px; height: 2px; border-radius: 2px; display:inline-block; }

  .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 12px; margin-bottom: 16px; }
  .donut-body { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .donut-body svg { flex-shrink: 0; }
  .donut-legend { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-secondary); flex: 1; min-width: 140px; }
  .donut-legend .key { display: flex; align-items: center; gap: 7px; justify-content: space-between; }
  .donut-legend .key .name { display: flex; align-items: center; gap: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .donut-legend .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; display:inline-block; }
  .donut-legend .pct { font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .chart-wrap { position: relative; }
  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  .gridline { stroke: var(--grid-line); stroke-width: 1; }
  .axisline { stroke: var(--axis-line); stroke-width: 1; }
  .tick-label { fill: var(--text-muted); font-size: 10.5px; }
  .end-label { fill: var(--text-primary); font-size: 11px; font-weight: 600; }
  .crosshair { stroke: var(--text-muted); stroke-width: 1; opacity: 0; pointer-events: none; }
  .hit-rect { fill: transparent; cursor: crosshair; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 50; opacity: 0;
    background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border-hair); border-radius: 8px;
    padding: 7px 10px; font-size: 11.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
    white-space: nowrap; transition: opacity .06s linear;
  }
  .tooltip .t-date { color: var(--text-muted); font-size: 10.5px; margin-bottom: 3px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 6px; }
  .tooltip .t-key { width: 9px; height: 2px; border-radius: 2px; display: inline-block; }
  .tooltip .t-val { font-weight: 700; margin-left: auto; padding-left: 10px; font-variant-numeric: tabular-nums; }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.data-table caption { display:none; }
  table.data-table th, table.data-table td {
    text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--grid-line);
    vertical-align: top;
  }
  table.data-table thead th { color: var(--text-secondary); font-weight: 700; font-size: 11.5px; background: var(--surface-2); border-bottom: 1px solid var(--axis-line); }
  table.data-table thead th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  table.data-table thead th.sortable:hover { color: var(--text-primary); }
  table.data-table tbody tr:nth-child(even) td { background: var(--surface-2); }
  table.data-table td.num, table.data-table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.data-table td.content-cell { max-width: 340px; }
  table.data-table td.content-cell .txt {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--text-secondary); font-size: 12px;
  }
  table.data-table a { color: var(--series-1); text-decoration: none; }
  table.data-table a:hover { text-decoration: underline; }
  .table-scroll { overflow-x: auto; }

  .highlight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 12px; margin-bottom: 16px; }
  .hl-card { background: var(--surface-1); border: 1px solid var(--border-hair); border-left: 3px solid var(--hl-accent, transparent); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow-card); }
  .hl-card .net { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--text-secondary); margin-bottom: 6px; }
  .hl-card .txt { font-size: 13px; color: var(--text-primary); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .hl-card .stats { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; }
  .hl-card .stats b { color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .hl-card a.go { font-size: 12px; }

  footer.foot { margin-top: 20px; font-size: 11.5px; color: var(--text-muted); text-align: center; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>

ed":19.0,"shares":18.0,"views":11762.0},{"date":"2026-06-26","content":"En junio los chicos de Madryn reciben a las ballenas 🐋\n\nComo todos los años, acompañamos a la Secretaria de Turismo de Puerto Madryn, en esta actividad que organizan junto a todos los alumnos de cuarto grado de todos los colegios de la ciudad.\n\nEl propósito de la actividad es generar conciencia respecto a la conservación del ambiente y del\nárea de reproducción de la Ballena Franca Austral.\n\nEn el marco de esta propuesta se dan charlas en los colegios y se finaliza con una visita al área\nprotegida municipal El Doradillo donde se avistan a las ballenas y luego se comparte un chocolate caliente ☕\n\n#comunidad #puertomadryn #ballenas #educación","url":"https://www.instagram.com/p/DaDl71ekbfC/","type":"FEED_CAROUSEL_ALBUM","comments":0.0,"interactions":98.0,"likes":90.0,"reach":1526.0,"saved":1.0,"shares":7.0,"views":3777.0},{"date":"2026-06-23","content":"¡El aspa de un aerogenerador es mucho más grande de lo que te imaginás! 😮\n\nDeslizá y enterate👉","url":"https://www.instagram.com/p/DZ7h7_XkT1y/","type":"FEED_CAROUSEL_ALBUM","comments":3.0,"interactions":217.0,"likes":189.0,"reach":3309.0,"saved":5.0,"shares":20.0,"views":8076.0},{"date":"2026-06-16","content":"⚽ El aluminio también entra a la cancha. Está en los tacos de los botines, los arcos y hasta en los bancos de suplentes 🥅\n\nLiviano, resistente y listo para jugar este mundial. \n\n#Aluar #Aluminioargentino","url":"https://www.instagram.com/p/DZpnFRPDiuG/","type":"FEED_CAROUSEL_ALBUM","comments":1.0,"interactions":101.0,"likes":91.0,"reach":1432.0,"saved":5.0,"shares":4.0,"views":3558.0},{"date":"2026-05-27","content":"Realizamos la 6ta edición de Juntos por Buenas Causas, el programa que impulsamos para acompañar iniciativas con impacto positivo en nuestras comunidades.\n\nEn esta edición, la temática elegida por la comunidad fue “Educación de Calidad”, centrada en el ODS 4 de los Objetivos de Desarrollo Sostenible de la ONU 📚\n\nSe recibieron 52 proyectos de los cuales 9 fueron seleccionados. Estas iniciativas se desarrollarán durante el segundo semestre de 2026, articulando el trabajo de 14 instituciones públicas y privadas de Puerto Madryn, Dolavon, 28 de Julio y Esquel.\n\nA través de Juntos por Buenas Causas seguimos promoviendo más oportunidades de aprendizaje, inclusión y equidad para la comunidad.","url":"https://www.instagram.com/p/DY1-whdGdRw/","type":"FEED_IMAGE","comments":3.0,"interactions":121.0,"likes":111.0,"reach":2908.0,"saved":3.0,"shares":4.0,"views":5290.0},{"date":"2026-05-18","content":"Las materias primas que utilizamos para producir nuestro aluminio son sumamente importantes. Son el primer paso de toda la cadena de valor 🙌\n\nPero ¿Sabés cuáles son?\n\nDeslizá las imágenes para conocer las principales materias primas que trabajamos en Aluar.\n\n#aluar #aluaraluminio #materiasprimas","url":"https://www.instagram.com/p/DYe19iWGTvq/","type":"FEED_CAROUSEL_ALBUM","comments":0.0,"interactions":72.0,"likes":66.0,"reach":1386.0,"saved":5.0,"shares":1.0,"views":3353.0},{"date":"2026-05-08","content":"Llegar al espacio es uno de los mayores hitos de la humanidad. Y el aluminio está presente en cada paso de ese camino 👨‍🚀\n\nLigero, resistente y versátil, es un material clave en la industria aeroespacial. Un aliado que transforma ideas en posibilidades y nos acerca a lo que alguna vez parecía imposible 🌕\n\nSin dudas, un aliado de nuestra imaginación. El aluminio nos permite llegar a escenarios impensados. \n\nA menos de un mes de esta expedición... ¿Qué sentís al ver las imágenes que nos dejó el Artemis II? 🚀","url":"https://www.instagram.com/p/DYFTkpToH2J/","type":"FEED_CAROUSEL_ALBUM","comments":0.0,"interactions":150.0,"likes":141.0,"reach":1779.0,"saved":2.0,"shares":7.0,"views":4296.0},{"date":"2026-04-30","content":"✨ Comenzó el Ciclo de Capacitaciones 2026 ✨\n\nJunto a la UTN – Facultad Regional Chubut, dimos inicio a una propuesta pensada para fortalecer la gestión, la organización y la planificación de las organizaciones sociales de nuestra comunidad 🤝\n\nEmpezamos con el Módulo 1: Comunicación efectiva, escucha activa y trabajo en equipo, un espacio de intercambio y aprendizaje colectivo que pone en valor el trabajo colaborativo 💬🙌\n\nDurante el mes de agosto se desarrollará el Módulo 2:  Finanzas para organizaciones sociales y durante noviembre el Módulo 3: Elaboración de proyectos sociales.\n\nSeguimos construyendo comunidad y fortaleciendo el entramado social 💙\n\n#comunidad #aluar #aluaraluminio","url":"https://www.instagram.com/p/DXwai9omWWN/","type":"FEED_CAROUSEL_ALBUM","comments":0.0,"interactions":148.0,"likes":133.0,"reach":3450.0,"saved":2.0,"shares":13.0,"views":8535.0},{"date":"2026-04-28","content":"En Aluar hay palabras que tienen un significado más allá de una definición. \n\nHoy te compartimos la primera palabra del Diccionario Aluar.\n\nDeslizá la imagen para saber de cuál hablamos. ¿La conocías? \n\nDejanos este emoji en comentarios si tu respuesta es sí 😎 y este si no tenías idea 😬","url":"https://www.instagram.com/p/DXrX3yTGSdk/","type":"FEED_CAROUSEL_ALBUM","comments":2.0,"interactions":43.0,"likes":40.0,"reach":1279.0,"saved":1.0,"shares":null,"views":2843.0},{"date":"2026-04-20","content":"Invertir es proyectar el futuro.\n\nSeguimos impulsando proyectos estratégicos que fortalecen nuestra capacidad productiva y el desarrollo energético del país⚡\n\nEnergía renovable, infraestructura y crecimiento sostenible para seguir produciendo aluminio argentino para el mundo\n\n#aluar #aluaraluminio #inversion","url":"https://www.instagram.com/p/DXWygNoDYA9/","type":"FEED_CAROUSEL_ALBUM","comments":2.0,"interactions":77.0,"likes":69.0,"reach":1256.0,"saved":3.0,"shares":3.0,"views":2750.0}],"linkedin":[{"date":"2026-07-15","title":"","url":"https://www.linkedin.com/feed/update/urn:li:ugcPost:7483165611813093379","comments":null,"impressions":2390.0,"likes":73.0,"shares":3.0,"type":"VIDEO"},{"date":"2026-07-13"," <script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById('dataset').textContent);

  const NET_COLOR = { instagram: 'var(--series-ig)', linkedin: 'var(--series-li)', youtube: 'var(--series-yt)' };
  const NET_LABEL = { instagram: 'Instagram', linkedin: 'LinkedIn', youtube: 'YouTube' };

  function fmtCompact(n){
    if(n === null || n === undefined || Number.isNaN(n)) return '—';
    const sign = n < 0 ? '-' : '';
    const abs = Math.abs(n);
    if(abs >= 1e6) return sign + trimZero((abs/1e6).toFixed(1)) + 'M';
    if(abs >= 1e4) return sign + trimZero((abs/1e3).toFixed(1)) + 'K';
    return sign + Math.round(abs).toLocaleString('es-AR');
  }
  function trimZero(s){ return s.replace(/\.0$/, ''); }
  function fmtInt(n){ if(n===null||n===undefined) return '—'; return Math.round(n).toLocaleString('es-AR'); }
  function fmtPct(n, digits){ if(n===null||n===undefined||Number.isNaN(n)) return '—'; return n.toFixed(digits===undefined?1:digits) + '%'; }
  function fmtDateShort(iso){ const [y,m,d]=iso.split('-'); return d+'/'+m; }
  function fmtDateLong(iso){ const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function sum(arr, key){ let s = 0, any=false; for(const r of arr){ if(r[key]!=null){ s += r[key]; any=true; } } return any ? s : null; }
  function lastVal(arr, key){ for(let i=arr.length-1;i>=0;i--){ if(arr[i][key]!=null) return arr[i][key]; } return null; }
  function firstVal(arr, key){ for(let i=0;i<arr.length;i++){ if(arr[i][key]!=null) return arr[i][key]; } return null; }

  // ---------- date range handling ----------
  const allDatesIG = DATA.evolution.instagram.map(r=>r.date);
  const MAX_DATE = allDatesIG[allDatesIG.length-1];
  const MIN_DATE = allDatesIG[0];

  function addDays(iso, n){
    const d = new Date(iso+'T00:00:00Z');
    d.setUTCDate(d.getUTCDate()+n);
    return d.toISOString().slice(0,10);
  }
  function daysBetween(a,b){
    return Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/86400000);
  }
  function clampMin(iso){ return iso < MIN_DATE ? MIN_DATE : iso; }

  const PRESETS = [
    { key:'7d', label:'7 días', from: addDays(MAX_DATE,-6) },
    { key:'30d', label:'30 días', from: addDays(MAX_DATE,-29) },
    { key:'90d', label:'90 días', from: addDays(MAX_DATE,-89) },
    { key:'365d', label:'12 meses', from: clampMin(addDays(MAX_DATE,-364)) },
  ];

  const state = {
    tab: 'overview',
    preset: '30d',
    from: PRESETS[1].from,
    to: MAX_DATE,
  };

  function inRange(r){ return r.date >= state.from && r.date <= state.to; }
  function prevPeriod(){
    const len = daysBetween(state.from, state.to) + 1;
    const to = addDays(state.from, -1);
    const from = addDays(to, -(len-1));
    return { from: clampMin(from), to };
  }

  // ---------- filter bar ----------
  function renderFilterBar(){
    const el = document.getElementById('filter-bar');
    el.innerHTML = '';
    const grp = document.createElement('div'); grp.className = 'grp';
    PRESETS.forEach(p=>{
      const b = document.createElement('button');
      b.className = 'chip' + (state.preset===p.key ? ' active':'');
      b.textContent = p.label;
      b.onclick = () => { state.preset = p.key; state.from = p.from; state.to = MAX_DATE; renderAll(); };
      grp.appendChild(b);
    });
    el.appendChild(grp);
    const sep = document.createElement('div'); sep.className='sep'; el.appendChild(sep);

    const custom = document.createElement('div'); custom.className='grp';
    const fromI = document.createElement('input'); fromI.type='date'; fromI.value = state.from; fromI.min = MIN_DATE; fromI.max = state.to;
    const toI = document.createElement('input'); toI.type='date'; toI.value = state.to; toI.min = state.from; toI.max = MAX_DATE;
    fromI.onchange = () => { state.preset='custom'; state.from = fromI.value; renderAll(); };
    toI.onchange = () => { state.preset='custom'; state.to = toI.value; renderAll(); };
    custom.appendChild(fromI);
    const dash = document.createElement('span'); dash.textContent='–'; dash.style.color='var(--text-muted)'; custom.appendChild(dash);
    custom.appendChild(toI);
    el.appendChild(custom);
  }

  // ---------- tabs ----------
  const TABS = [
    { key:'overview', label:'Resumen' },
    { key:'instagram', label:'Instagram' },
    { key:'linkedin', label:'LinkedIn' },
    { key:'youtube', label:'YouTube' },
  ];
  function renderTabs(){
    const el = document.getElementById('tabs');
    el.innerHTML = '';
    TABS.forEach(t=>{
      const b = document.createElement('button');
      b.textContent = t.label;
      b.className = state.tab===t.key ? 'active' : '';
      b.onclick = () => { state.tab = t.key; renderAll(); };
      el.appendChild(b);
    });
  }

  // ---------- stat tile ----------
  function statTile(label, value, delta, opts){
    opts = opts || {};
    const div = document.createElement('div');
    div.className = 'tile';
    const deltaHtml = (delta===null||delta===undefined) ? '' :
      `<div class="delta ${delta>0?'up':delta<0?'down':'flat'}">${delta>0?'▲':delta<0?'▼':'·'} ${opts.deltaIsPct ? fmtPct(Math.abs(delta)) : fmtCompact(Math.abs(delta))} ${opts.deltaSuffix||'vs. período anterior'}</div>`;
    div.innerHTML = `<div class="label">${escapeHtml(label)}</div><div class="value">${value}</div>${deltaHtml}`;
    if(opts.accent) div.style.setProperty('--tile-accent', opts.accent);
    return div;
  }

  // ---------- mini bar chart (cross-network comparison) ----------
  // Renders a small set of horizontal bars (one per network) into an existing
  // card container. Each bar has its own scale (bar length relative to the
  // max within this metric only) — never compare across metrics of different units.
  function renderMiniBars(container, items){
    const maxV = Math.max(1, ...items.map(it => it.value || 0));
    const rows = document.createElement('div');
    rows.style.cssText = 'display:flex;flex-direction:column;gap:10px;margin-top:4px';
    items.forEach(it => {
      const pct = Math.max(2, (it.value || 0) / maxV * 100);
      const row = document.createElement('div');
      row.innerHTML = `
        <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-secondary);margin-bottom:3px">
          <span>${escapeHtml(it.label)}</span>
          <span style="font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums">${fmtCompact(it.value)}</span>
        </div>
        <div style="height:10px;border-radius:4px;background:var(--grid-line);overflow:hidden">
          <div style="height:100%;width:${pct.toFixed(1)}%;border-radius:4px;background:${it.color}"></div>
        </div>`;
      rows.appendChild(row);
    });
    container.appendChild(rows);
  }

  // ---------- donut chart (demographic breakdowns) ----------
  // items: [{label, pct}], expected pre-sorted desc with any "Otros" bucket last.
  function renderDonutChart(container, items){
    const size = 148, R = 54, strokeW = 22, cx = size/2, cy = size/2;
    const C = 2 * Math.PI * R;
    const colors = ['var(--cat-1)','var(--cat-2)','var(--cat-3)','var(--cat-4)','var(--cat-5)'];
    let cum = 0, circles = '', legendHtml = '', colorIdx = 0;
    items.forEach(it => {
      const color = it.label === 'Otros' ? 'var(--cat-6)' : colors[colorIdx++ % colors.length];
      const segLen = Math.max(0, (it.pct/100) * C);
      circles += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${color}" stroke-width="${strokeW}" stroke-dasharray="${segLen.toFixed(2)} ${(C-segLen).toFixed(2)}" stroke-dashoffset="${(-cum).toFixed(2)}"></circle>`;
      cum += segLen;
      legendHtml += `<div class="key"><span class="name"><span class="swatch" style="background:${color}"></span>${escapeHtml(it.label)}</span><span class="pct">${fmtPct(it.pct)}</span></div>`;
    });
    const top = items.reduce((best, it) => (!best || it.pct > best.pct) ? it : best, null) || { label:'—', pct:0 };
    const topLabel = top.label.length > 13 ? top.label.slice(0,12)+'…' : top.label;
    const wrap = document.createElement('div');
    wrap.className = 'donut-body';
    wrap.innerHTML = `
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <g transform="rotate(-90 ${cx} ${cy})">${circles}</g>
        <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text-primary)">${fmtPct(top.pct)}</text>
        <text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="9.5" fill="var(--text-muted)">${escapeHtml(topLabel)}</text>
      </svg>
      <div class="donut-legend">${legendHtml}</div>`;
    container.appendChild(wrap);
  }

  // ---------- line chart ----------
  let tooltipEl;
  function ensureTooltip(){
    if(!tooltipEl){
      tooltipEl = document.createElement('div');
      tooltipEl.className = 'tooltip';
      document.querySelector('.viz-root').appendChild(tooltipEl);
    }
    return tooltipEl;
  }

  // series: [{name, color, points:[{date,value}], format}]
  function renderLineChart(container, series, opts){
    opts = opts || {};
    const height = opts.height || 200;
    const width = 640;
    const padL = 50, padR = 14, padT = 14, padB = 24;
    const dates = series[0].points.map(p=>p.date);
    const n = dates.length;
    let minY = Infinity, maxY = -Infinity;
    series.forEach(s => s.points.forEach(p => { if(p.value!=null){ if(p.value<minY) minY=p.value; if(p.value>maxY) maxY=p.value; } }));
    if(!isFinite(minY)){ minY = 0; maxY = 1; }
    if(minY===maxY){ minY -= 1; maxY += 1; }
    if(opts.bars || opts.startAtZero){
      minY = Math.min(0, minY);
      maxY = maxY + (maxY-minY) * 0.08;
    } else {
      const padValue = (maxY-minY) * 0.08;
      minY -= padValue; maxY += padValue;
    }

    const x = i => padL + (n<=1 ? 0 : (i/(n-1)) * (width-padL-padR));
    const y = v => padT + (1 - (v-minY)/(maxY-minY)) * (height-padT-padB);

    const wrap = document.createElement('div');
    wrap.className = 'chart-wrap';

    // gridlines (4 steps)
    const steps = 4;
    let gridSvg = '';
    for(let i=0;i<=steps;i++){
      const val = minY + (maxY-minY)*i/steps;
      const yy = y(val);
      gridSvg += `<line class="gridline" x1="${padL}" x2="${width-padR}" y1="${yy}" y2="${yy}"></line>`;
      gridSvg += `<text class="tick-label" x="${padL-6}" y="${yy+3}" text-anchor="end">${fmtCompact(val)}</text>`;
    }
    gridSvg += `<line class="axisline" x1="${padL}" x2="${width-padR}" y1="${height-padB}" y2="${height-padB}"></line>`;

    // rounded-top column path: square at the baseline, per mark spec
    function barPath(xLeft, yTop, w, yBase){
      const r = Math.max(0, Math.min(4, w/2, yBase-yTop));
      const xRight = xLeft+w;
      if(r===0) return `M${xLeft},${yBase} L${xLeft},${yTop} L${xRight},${yTop} L${xRight},${yBase} Z`;
      return `M${xLeft},${yBase} L${xLeft},${yTop+r} Q${xLeft},${yTop} ${xLeft+r},${yTop} L${xRight-r},${yTop} Q${xRight},${yTop} ${xRight},${yTop+r} L${xRight},${yBase} Z`;
    }

    let seriesSvg = '';
    series.forEach(s => {
      if(opts.bars){
        const slot = n<=1 ? (width-padL-padR) : (width-padL-padR)/(n-1);
        const barW = Math.max(2, Math.min(24, slot-2));
        const yBase = y(Math.max(minY,0));
        for(let i=0;i<n;i++){
          const p = s.points[i];
          if(p.value==null) continue;
          const xLeft = x(i) - barW/2;
          const yTop = y(p.value);
          seriesSvg += `<path d="${barPath(xLeft, yTop, barW, yBase)}" fill="${s.color}"></path>`;
        }
        return;
      }
      if(opts.scatter){
        for(let i=0;i<n;i++){
          const p = s.points[i];
          if(p.value==null) continue;
          seriesSvg += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3.5" fill="${s.color}"></circle>`;
        }
        return;
      }
      let d = '', pen = false;
      for(let i=0;i<n;i++){
        const p = s.points[i];
        if(p.value==null){ pen = false; continue; }
        const cmd = pen ? 'L' : 'M';
        d += `${cmd}${x(i).toFixed(1)},${y(p.value).toFixed(1)} `;
        pen = true;
      }
      seriesSvg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>`;
      // end dot + label
      for(let i=n-1;i>=0;i--){
        if(s.points[i].value!=null){
          seriesSvg += `<circle cx="${x(i)}" cy="${y(s.points[i].value)}" r="4" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"></circle>`;
          if(series.length===1){
            seriesSvg += `<text class="end-label" x="${x(i)}" y="${y(s.points[i].value)-10}" text-anchor="end">${(s.format||fmtCompact)(s.points[i].value)}</text>`;
          }
          break;
        }
      }
    });

    // x-axis: first / mid / last date labels
    const idxs = n>1 ? [0, Math.floor((n-1)/2), n-1] : [0];
    let xLabels = '';
    idxs.forEach(i => {
      xLabels += `<text class="tick-label" x="${x(i)}" y="${height-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${fmtDateShort(dates[i])}</text>`;
    });

    wrap.innerHTML = `
      <svg class="chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
        ${gridSvg}
        ${seriesSvg}
        ${xLabels}
        <line class="crosshair" x1="0" x2="0" y1="${padT}" y2="${height-padB}"></line>
        <rect class="hit-rect" x="${padL}" y="0" width="${width-padL-padR}" height="${height}"></rect>
      </svg>`;

    const svg = wrap.querySelector('svg');
    const hit = wrap.querySelector('.hit-rect');
    const crosshair = wrap.querySelector('.crosshair');
    const tip = ensureTooltip();

    hit.addEventListener('pointermove', (ev) => {
      const rect = svg.getBoundingClientRect();
      const relX = (ev.clientX - rect.left) / rect.width * width;
      let idx = Math.round(((relX - padL) / (width-padL-padR)) * (n-1));
      idx = Math.max(0, Math.min(n-1, idx));
      crosshair.setAttribute('x1', x(idx)); crosshair.setAttribute('x2', x(idx));
      crosshair.style.opacity = 1;
      let rows = '';
      series.forEach(s => {
        const v = s.points[idx].value;
        rows += `<div class="t-row"><span class="t-key" style="background:${s.color}"></span>${escapeHtml(s.name)}<span class="t-val">${(s.format||fmtCompact)(v)}</span></div>`;
      });
      tip.innerHTML = `<div class="t-date">${fmtDateLong(dates[idx])}</div>${rows}`;
      tip.style.left = (ev.clientX + 14) + 'px';
      tip.style.top = (ev.clientY + 14) + 'px';
      tip.style.opacity = 1;
    });
    hit.addEventListener('pointerleave', () => { crosshair.style.opacity = 0; tip.style.opacity = 0; });

    container.appendChild(wrap);

    if(series.length>1){
      const legend = document.createElement('div'); legend.className='legend';
      series.forEach(s=>{
        legend.innerHTML += `<span class="key"><span class="swatch" style="background:${s.color}"></span>${escapeHtml(s.name)}</span>`;
      });
      container.insertBefore(legend, wrap);
    }

    // table-view toggle
    const table = document.createElement('div');
    table.className = 'table-scroll';
    table.style.display = 'none';
    let thead = '<tr><th>Fecha</th>' + series.map(s=>`<th class="num">${escapeHtml(series.length>1?s.name:'Valor')}</th>`).join('') + '</tr>';
    let tbody = '';
    for(let i=n-1;i>=0;i--){
      tbody += '<tr><td>'+fmtDateLong(dates[i])+'</td>' + series.map(s=>`<td class="num">${(s.format||fmtCompact)(s.points[i].value)}</td>`).join('') + '</tr>';
    }
    table.innerHTML = `<table class="data-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
    container.appendChild(table);

    const toggle = document.createElement('button');
    toggle.className = 'toggle';
    toggle.textContent = 'Ver tabla';
    toggle.onclick = () => {
      const showingTable = table.style.display !== 'none';
      table.style.display = showingTable ? 'none' : 'block';
      wrap.style.display = showingTable ? 'block' : 'none';
      if(legendRef) legendRef.style.display = showingTable ? 'flex' : 'none';
      toggle.textContent = showingTable ? 'Ver tabla' : 'Ver gráfico';
    };
    var legendRef = container.querySelector('.legend');
    container.insertBefore(toggle, container.firstChild.nextSibling);
  }

  function chartCard(title, caption){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3>${escapeHtml(title)}</h3><div class="cap">${escapeHtml(caption||'')}</div>`;
    return card;
  }

  // ---------- top content table ----------
  const TYPE_LABEL = {
    FEED_IMAGE:'Imagen', FEED_CAROUSEL_ALBUM:'Carrusel', REEL:'Reel', VIDEO:'Video',
    IMAGE:'Imagen', POLL:'Encuesta', ARTICLE:'Artículo', DOCUMENT:'Documento',
    TEXT:'Texto', MULTIIMAGE:'Álbum',
  };
  function postLabel(r, network){
    if(r.title && r.title.trim()) return r.title.trim();
    if(r.content && r.content.trim()) return r.content.trim().slice(0,80);
    const kind = TYPE_LABEL[r.type] || (network==='linkedin'?'Publicación':network==='youtube'?'Video':'Publicación');
    return `${kind} · ${fmtDateLong(r.date)}`;
  }
  function postEngagement(r, network){
    if(network==='instagram') return r.reach ? (r.interactions||0)/r.reach*100 : null;
    if(network==='linkedin') return r.impressions ? ((r.likes||0)+(r.comments||0)+(r.shares||0))/r.impressions*100 : null;
    return r.views ? ((r.likes||0)+(r.comments||0))/r.views*100 : null;
  }
  function renderDemographicsSection(container, network){
    const demo = DATA.demographics && DATA.demographics[network];
    if(!demo) return;
    const specs = network==='linkedin'
      ? [['seniority','Antigüedad laboral','Distribución de seguidores por nivel de experiencia.'],
         ['industry','Industria','Distribución de seguidores por rubro.']]
      : [['age','Edad','Distribución de la audiencia por rango etario.'],
         ['gender','Género','Distribución de la audiencia por género.'],
         ['country','País','Principales países de la audiencia.']];
    const grid = document.createElement('div'); grid.className = 'demo-grid';
    specs.forEach(spec => {
      const items = demo[spec[0]];
      if(!items || !items.length) return;
      const card = chartCard(spec[1], spec[2]);
      renderDonutChart(card, items);
      grid.appendChild(card);
    });
    if(!grid.children.length) return;
    container.insertAdjacentHTML('beforeend', '<h3 style="font-size:13.5px;margin:4px 0 10px">Audiencia</h3>');
    container.appendChild(grid);
  }

  function topContentTable(container, network, range){
    const rows = DATA.topContent[network].filter(r => r.date >= range.from && r.date <= range.to);
    const card = document.createElement('div');
    card.className = 'card';
    if(rows.length===0){
      card.innerHTML = `<h3>Publicaciones destacadas</h3><div class="empty">Sin publicaciones en el rango seleccionado.</div>`;
      container.appendChild(card);
      return;
    }
    let cols, defaultKey;
    if(network==='instagram'){
      cols = [['Fecha','date'],['Publicación','title'],['Alcance','reach'],['Interacciones','interactions'],['Engagement','engagement'],['Likes','likes'],['Comentarios','comments'],['Guardados','saved']];
      defaultKey = 'interactions';
    } else if(network==='linkedin'){
      cols = [['Fecha','date'],['Publicación','title'],['Impresiones','impressions'],['Reacciones','likes'],['Comentarios','comments'],['Compartidos','shares'],['Engagement','engagement']];
      defaultKey = 'impressions';
    } else {
      cols = [['Fecha','date'],['Título','title'],['Vistas','views'],['Min. vistos','watchMinutes'],['Likes','likes'],['Comentarios','comments'],['Engagement','engagement']];
      defaultKey = 'views';
    }
    const baseRows = rows.slice().sort((a,b)=>(b[defaultKey]||0)-(a[defaultKey]||0)).slice(0,8);
    const sortState = { key: defaultKey, dir: 'desc' };

    function cellValue(r, key){
      if(key==='engagement') return postEngagement(r, network);
      return r[key];
    }
    function cellHtml(r, key){
      if(key==='date') return `<td>${fmtDateShort(r.date)}</td>`;
      if(key==='title'){
        const label = postLabel(r, network);
        const href = r.watchUrl || r.url;
        return href ? `<td class="content-cell"><a href="${href}" target="_blank" rel="noopener">${escapeHtml(label)}</a></td>` : `<td class="content-cell">${escapeHtml(label)}</td>`;
      }
      if(key==='engagement') return `<td class="num">${fmtPct(postEngagement(r, network))}</td>`;
      return `<td class="num">${fmtCompact(r[key])}</td>`;
    }
    function sortedRows(){
      return baseRows.slice().sort((a,b)=>{
        if(sortState.key==='date'){
          return sortState.dir==='asc' ? (a.date<b.date?-1:a.date>b.date?1:0) : (a.date<b.date?1:a.date>b.date?-1:0);
        }
        const av = cellValue(a, sortState.key), bv = cellValue(b, sortState.key);
        const an = (av==null||Number.isNaN(av)) ? -Infinity : av, bn = (bv==null||Number.isNaN(bv)) ? -Infinity : bv;
        return sortState.dir==='asc' ? an-bn : bn-an;
      });
    }
    function renderTbody(){
      return sortedRows().map(r => '<tr>' + cols.map(c => cellHtml(r, c[1])).join('') + '</tr>').join('');
    }
    function headerLabel(c){
      const arrow = sortState.key===c[1] ? (sortState.dir==='asc' ? ' ▲' : ' ▼') : '';
      return escapeHtml(c[0]) + arrow;
    }
    function renderThead(){
      return '<tr>' + cols.map(c => {
        const sortable = c[1] !== 'title';
        const cls = [c[1]!=='date'&&c[1]!=='title' ? 'num' : '', sortable ? 'sortable' : ''].filter(Boolean).join(' ');
        return `<th${cls?` class="${cls}"`:''}${sortable?` data-key="${c[1]}"`:''}>${headerLabel(c)}</th>`;
      }).join('') + '</tr>';
    }

    card.innerHTML = `<h3>Publicaciones destacadas</h3><div class="cap">Top 8 del período por ${cols.find(c=>c[1]===defaultKey)[0].toLowerCase()} · hacé clic en una columna para ordenar</div>
      <div class="table-scroll"><table class="data-table"><thead>${renderThead()}</thead><tbody>${renderTbody()}</tbody></table></div>`;
    container.appendChild(card);

    const thead = card.querySelector('thead');
    const tbody = card.querySelector('tbody');
    function wireHeaders(){
      thead.querySelectorAll('th[data-key]').forEach(th => {
        th.addEventListener('click', () => {
          const key = th.getAttribute('data-key');
          if(sortState.key === key) sortState.dir = sortState.dir==='asc' ? 'desc' : 'asc';
          else { sortState.key = key; sortState.dir = 'desc'; }
          thead.innerHTML = renderThead();
          tbody.innerHTML = renderTbody();
          wireHeaders();
        });
      });
    }
    wireHeaders();
  }

  // ---------- overview tab ----------
  function renderOverview(){
    const content = document.getElementById('content');
    const range = { from: state.from, to: state.to };
    const prev = prevPeriod();

    const igR = DATA.evolution.instagram.filter(inRange);
    const liR = DATA.evolution.linkedin.filter(inRange);
    const ytR = DATA.evolution.youtube.filter(inRange);
    const igP = DATA.evolution.instagram.filter(r=>r.date>=prev.from && r.date<=prev.to);
    const liP = DATA.evolution.linkedin.filter(r=>r.date>=prev.from && r.date<=prev.to);
    const ytP = DATA.evolution.youtube.filter(r=>r.date>=prev.from && r.date<=prev.to);

    const igFollowers = lastVal(igR,'followers'), liFollowers = lastVal(liR,'followers'), ytSubs = lastVal(ytR,'subscribers');
    const igFollowersPrev = lastVal(igP,'followers'), liFollowersPrev = lastVal(liP,'followers'), ytSubsPrev = lastVal(ytP,'subscribers');
    const totalAudience = (igFollowers||0)+(liFollowers||0)+(ytSubs||0);
    const totalAudiencePrev = (igFollowersPrev||0)+(liFollowersPrev||0)+(ytSubsPrev||0);

    const igInter = sum(igR,'postsInteractions')||0;
    const liInter = sum(liR,'accountPostInteractions')||0;
    const ytInter = (sum(ytR,'publishedVideoLikes')||0)+(sum(ytR,'publishedVideoComments')||0);
    const totalInter = igInter+liInter+ytInter;
    const igInterPrev = sum(igP,'postsInteractions')||0;
    const liInterPrev = sum(liP,'accountPostInteractions')||0;
    const ytInterPrev = (sum(ytP,'publishedVideoLikes')||0)+(sum(ytP,'publishedVideoComments')||0);
    const totalInterPrev = igInterPrev+liInterPrev+ytInterPrev;

    const igPosts = sum(igR,'postsCount')||0, liPosts = sum(liR,'accountPostCount')||0, ytVideos = sum(ytR,'videos')||0;
    const totalPosts = igPosts+liPosts+ytVideos;
    const days = daysBetween(range.from, range.to)+1;
    const cadence = totalPosts / (days/7);

    const postsPrevTotal = (sum(igP,'postsCount')||0)+(sum(liP,'accountPostCount')||0)+(sum(ytP,'videos')||0);

    const grid = document.createElement('div'); grid.className = 'grid';
    grid.appendChild(statTile('Audiencia total (IG+LI+YT)', fmtCompact(totalAudience), totalAudience-totalAudiencePrev));
    grid.appendChild(statTile('Interacciones totales', fmtCompact(totalInter), totalInter-totalInterPrev));
    grid.appendChild(statTile('Publicaciones en el período', fmtInt(totalPosts), totalPosts-postsPrevTotal));
    grid.appendChild(statTile('Cadencia de publicación', cadence.toFixed(1)+'/sem', null));
    content.appendChild(grid);

    // cross-network comparison (each metric its own scale — never mixed)
    const cmpCards = document.createElement('div'); cmpCards.className = 'cards cols-3';
    const cmpAudience = chartCard('Audiencia por red', 'Seguidores / suscriptores al cierre del período.');
    renderMiniBars(cmpAudience, [
      { label:'Instagram', value: igFollowers||0, color:'var(--series-ig)' },
      { label:'LinkedIn', value: liFollowers||0, color:'var(--series-li)' },
      { label:'YouTube', value: ytSubs||0, color:'var(--series-yt)' },
    ].sort((a,b)=>b.value-a.value));
    cmpCards.appendChild(cmpAudience);
    const cmpInter = chartCard('Interacciones por red', 'Suma del período seleccionado.');
    renderMiniBars(cmpInter, [
      { label:'Instagram', value: igInter, color:'var(--series-ig)' },
      { label:'LinkedIn', value: liInter, color:'var(--series-li)' },
      { label:'YouTube', value: ytInter, color:'var(--series-yt)' },
    ].sort((a,b)=>b.value-a.value));
    cmpCards.appendChild(cmpInter);
    const cmpPosts = chartCard('Publicaciones por red', 'Suma del período seleccionado.');
    renderMiniBars(cmpPosts, [
      { label:'Instagram', value: igPosts, color:'var(--series-ig)' },
      { label:'LinkedIn', value: liPosts, color:'var(--series-li)' },
      { label:'YouTube', value: ytVideos, color:'var(--series-yt)' },
    ].sort((a,b)=>b.value-a.value));
    cmpCards.appendChild(cmpPosts);
    content.appendChild(cmpCards);

    // indexed growth chart
    const card = chartCard('Crecimiento de audiencia (indexado a 100 al inicio del período)', 'Compara el ritmo de crecimiento entre redes, independientemente de su tamaño.');
    const mkIdx = (rows, key) => {
      const base = firstVal(rows, key);
      return rows.map(r => ({ date: r.date, value: (r[key]==null || !base) ? null : (r[key]/base*100) }));
    };
    const idxFormat = v => v==null ? '—' : v.toFixed(1);
    renderLineChart(card, [
      { name:'Instagram', color:'var(--series-ig)', points: mkIdx(igR,'followers'), format: idxFormat },
      { name:'LinkedIn', color:'var(--series-li)', points: mkIdx(liR,'followers'), format: idxFormat },
      { name:'YouTube', color:'var(--series-yt)', points: mkIdx(ytR,'subscribers'), format: idxFormat },
    ]);
    content.appendChild(card);

    // highlight cards: top post per network within range
    const hlGrid = document.createElement('div'); hlGrid.className = 'highlight-grid';
    const pick = (network, metricKey) => {
      const rows = DATA.topContent[network].filter(r=>r.date>=range.from && r.date<=range.to);
      if(rows.length===0) return null;
      return rows.slice().sort((a,b)=>(b[metricKey]||0)-(a[metricKey]||0))[0];
    };
    const hlSpecs = [
      { net:'instagram', metric:'interactions', label:'Interacciones' },
      { net:'linkedin', metric:'impressions', label:'Impresiones' },
      { net:'youtube', metric:'views', label:'Vistas' },
    ];
    hlSpecs.forEach(spec => {
      const post = pick(spec.net, spec.metric);
      const div = document.createElement('div'); div.className='hl-card';
      div.style.setProperty('--hl-accent', NET_COLOR[spec.net]);
      if(!post){
        div.innerHTML = `<div class="net">${NET_LABEL[spec.net]} · mejor publicación</div><div class="empty" style="padding:6px 0">Sin publicaciones en el rango.</div>`;
      } else {
        const txt = postLabel(post, spec.net);
        const eng = postEngagement(post, spec.net);
        div.innerHTML = `<div class="net">${NET_LABEL[spec.net]} · mejor publicación (${fmtDateShort(post.date)})</div>
          <div class="txt">${escapeHtml(txt)}</div>
          <div class="stats"><span>${spec.label}: <b>${fmtCompact(post[spec.metric])}</b></span>
          ${eng!=null?`<span>Engagement: <b>${fmtPct(eng)}</b></span>`:''}
          ${post.likes!=null?`<span>Likes: <b>${fmtCompact(post.likes)}</b></span>`:''}
          ${post.comments!=null?`<span>Comentarios: <b>${fmtCompact(post.comments)}</b></span>`:''}</div>
          <a class="go" href="${post.watchUrl||post.url}" target="_blank" rel="noopener">Ver publicación →</a>`;
      }
      hlGrid.appendChild(div);
    });
    content.appendChild(hlGrid);
  }

  // ---------- per-network tab ----------
  function renderNetwork(network){
    const content = document.getElementById('content');
    const range = { from: state.from, to: state.to };
    const prev = prevPeriod();
    const rows = DATA.evolution[network].filter(inRange);
    const rowsPrev = DATA.evolution[network].filter(r=>r.date>=prev.from && r.date<=prev.to);

    const grid = document.createElement('div'); grid.className='grid';
    grid.style.setProperty('--tile-accent', NET_COLOR[network]);

    if(network==='instagram'){
      const followers = lastVal(rows,'followers'), followersPrev = lastVal(rowsPrev,'followers');
      const reach = sum(rows,'reach')||0, reachPrev = sum(rowsPrev,'reach')||0;
      const inter = sum(rows,'postsInteractions')||0, interPrev = sum(rowsPrev,'postsInteractions')||0;
      const posts = sum(rows,'postsCount')||0, postsPrev = sum(rowsPrev,'postsCount')||0;
      const reelsViews = sum(rows,'reelsViews')||0, reelsViewsPrev = sum(rowsPrev,'reelsViews')||0;
      const engRate = reach ? inter/reach*100 : null;
      const engRatePrev = reachPrev ? interPrev/reachPrev*100 : null;

      grid.appendChild(statTile('Seguidores', fmtCompact(followers), followers-followersPrev));
      grid.appendChild(statTile('Alcance', fmtCompact(reach), reach-reachPrev));
      grid.appendChild(statTile('Interacciones', fmtCompact(inter), inter-interPrev));
      grid.appendChild(statTile('Tasa de engagement', fmtPct(engRate), engRate!=null&&engRatePrev!=null?engRate-engRatePrev:null, {deltaIsPct:true}));
      grid.appendChild(statTile('Publicaciones', fmtInt(posts), posts-postsPrev));
      grid.appendChild(statTile('Vistas de Reels', fmtCompact(reelsViews), reelsViews-reelsViewsPrev));
      content.appendChild(grid);

      const cards = document.createElement('div'); cards.className='cards';
      let c = chartCard('Seguidores', 'Evolución diaria en el rango seleccionado.');
      c.classList.add('wide');
      renderLineChart(c, [{ name:'Seguidores', color:NET_COLOR.instagram, points: rows.map(r=>({date:r.date,value:r.followers})) }], {height:300});
      cards.appendChild(c);
      c = chartCard('Alcance diario', 'Cuentas alcanzadas por día (organico + pago).');
      renderLineChart(c, [{ name:'Alcance', color:NET_COLOR.instagram, points: rows.map(r=>({date:r.date,value:r.reach})) }], {height:260});
      cards.appendChild(c);
      c = chartCard('Interacciones diarias', 'Likes + comentarios + guardados + compartidos (posts y reels).');
      renderLineChart(c, [{ name:'Interacciones', color:NET_COLOR.instagram, points: rows.map(r=>({date:r.date,value:r.postsInteractions})) }], {height:260, bars:true});
      cards.appendChild(c);
      content.appendChild(cards);

    } else if(network==='linkedin'){
      const followers = lastVal(rows,'followers'), followersPrev = lastVal(rowsPrev,'followers');
      const impressions = sum(rows,'accountPostImpressions')||0, impressionsPrev = sum(rowsPrev,'accountPostImpressions')||0;
      const inter = sum(rows,'accountPostInteractions')||0, interPrev = sum(rowsPrev,'accountPostInteractions')||0;
      const posts = sum(rows,'accountPostCount')||0, postsPrev = sum(rowsPrev,'accountPostCount')||0;
      const visitors = sum(rows,'accountPageUniqueImpressions')||0, visitorsPrev = sum(rowsPrev,'accountPageUniqueImpressions')||0;
      const engRate = impressions ? inter/impressions*100 : null;
      const engRatePrev = impressionsPrev ? interPrev/impressionsPrev*100 : null;
      const clicks = sum(rows,'accountPostClicks')||0, clicksPrev = sum(rowsPrev,'accountPostClicks')||0;
      const ctr = impressions ? clicks/impressions*100 : null;
      const ctrPrev = impressionsPrev ? clicksPrev/impressionsPrev*100 : null;

      grid.appendChild(statTile('Seguidores', fmtCompact(followers), followers-followersPrev));
      grid.appendChild(statTile('Impresiones', fmtCompact(impressions), impressions-impressionsPrev));
      grid.appendChild(statTile('Interacciones', fmtCompact(inter), inter-interPrev));
      grid.appendChild(statTile('Tasa de engagement', fmtPct(engRate), engRate!=null&&engRatePrev!=null?engRate-engRatePrev:null, {deltaIsPct:true}));
      grid.appendChild(statTile('Clics', fmtCompact(clicks), clicks-clicksPrev));
      grid.appendChild(statTile('CTR', fmtPct(ctr), ctr!=null&&ctrPrev!=null?ctr-ctrPrev:null, {deltaIsPct:true}));
      grid.appendChild(statTile('Publicaciones', fmtInt(posts), posts-postsPrev));
      grid.appendChild(statTile('Visitantes de página', fmtCompact(visitors), visitors-visitorsPrev));
      content.appendChild(grid);

      const cards = document.createElement('div'); cards.className='cards';
      let c = chartCard('Seguidores', 'Evolución diaria en el rango seleccionado.');
      c.classList.add('wide');
      renderLineChart(c, [{ name:'Seguidores', color:NET_COLOR.linkedin, points: rows.map(r=>({date:r.date,value:r.followers})) }], {height:300});
      cards.appendChild(c);
      c = chartCard('Impresiones diarias', 'Veces que se mostraron las publicaciones de la página.');
      renderLineChart(c, [{ name:'Impresiones', color:NET_COLOR.linkedin, points: rows.map(r=>({date:r.date,value:r.accountPostImpressions})) }], {height:260});
      cards.appendChild(c);
      c = chartCard('Interacciones diarias', 'Reacciones + comentarios + clics.');
      renderLineChart(c, [{ name:'Interacciones', color:NET_COLOR.linkedin, points: rows.map(r=>({date:r.date,value:r.accountPostInteractions})) }], {height:260, bars:true});
      cards.appendChild(c);
      c = chartCard('CTR diario', 'Clics / impresiones de las publicaciones, por día.');
      renderLineChart(c, [{ name:'CTR', color:NET_COLOR.linkedin, points: rows.map(r=>({date:r.date,value:(r.accountPostClicks!=null&&r.accountPostImpressions)?r.accountPostClicks/r.accountPostImpressions*100:null})), format: v => fmtPct(v) }], {height:260, startAtZero:true});
      cards.appendChild(c);
      content.appendChild(cards);

    } else {
      const subs = lastVal(rows,'subscribers'), subsPrev = lastVal(rowsPrev,'subscribers');
      const views = sum(rows,'videoViews')||0, viewsPrev = sum(rowsPrev,'videoViews')||0;
      const videos = sum(rows,'videos')||0, videosPrev = sum(rowsPrev,'videos')||0;
      const pubViews = sum(rows,'publishedVideoViews')||0, pubViewsPrev = sum(rowsPrev,'publishedVideoViews')||0;
      const likes = sum(rows,'publishedVideoLikes')||0, likesPrev = sum(rowsPrev,'publishedVideoLikes')||0;
      const comments = sum(rows,'publishedVideoComments')||0, commentsPrev = sum(rowsPrev,'publishedVideoComments')||0;
      const engRate = pubViews ? (likes+comments)/pubViews*100 : null;
      const engRatePrev = pubViewsPrev ? (likesPrev+commentsPrev)/pubViewsPrev*100 : null;

      grid.appendChild(statTile('Suscriptores', fmtCompact(subs), subs-subsPrev));
      grid.appendChild(statTile('Vistas totales', fmtCompact(views), views-viewsPrev));
      grid.appendChild(statTile('Videos publicados', fmtInt(videos), videos-videosPrev));
      grid.appendChild(statTile('Vistas (videos del período)', fmtCompact(pubViews), pubViews-pubViewsPrev));
      grid.appendChild(statTile('Tasa de engagement', fmtPct(engRate), engRate!=null&&engRatePrev!=null?engRate-engRatePrev:null, {deltaIsPct:true}));
      grid.appendChild(statTile('Likes', fmtCompact(likes), likes-likesPrev));
      grid.appendChild(statTile('Comentarios', fmtCompact(comments), comments-commentsPrev));
      content.appendChild(grid);

      const cards = document.createElement('div'); cards.className='cards';
      let c = chartCard('Suscriptores', 'Evolución diaria en el rango seleccionado.');
      renderLineChart(c, [{ name:'Suscriptores', color:NET_COLOR.youtube, points: rows.map(r=>({date:r.date,value:r.subscribers})) }]);
      cards.appendChild(c);
      c = chartCard('Vistas diarias', 'Vistas totales del canal por día.');
      renderLineChart(c, [{ name:'Vistas', color:NET_COLOR.youtube, points: rows.map(r=>({date:r.date,value:r.videoViews})) }]);
      cards.appendChild(c);
      c = chartCard('Interacciones diarias', 'Likes + comentarios de videos publicados en el período.');
      renderLineChart(c, [{ name:'Interacciones', color:NET_COLOR.youtube, points: rows.map(r=>({date:r.date,value:(r.publishedVideoLikes==null&&r.publishedVideoComments==null)?null:(r.publishedVideoLikes||0)+(r.publishedVideoComments||0)})) }], {height:260, bars:true});
      cards.appendChild(c);
      content.appendChild(cards);
    }

    renderDemographicsSection(content, network);
    topContentTable(content, network, range);
  }

  function renderAll(){
    renderFilterBar();
    renderTabs();
    const content = document.getElementById('content');
    content.innerHTML = '';
    document.getElementById('meta-info').textContent =
      'Rango: ' + fmtDateLong(state.from) + ' – ' + fmtDateLong(state.to) + ' · generado ' + new Date(DATA.meta.generatedAt).toLocaleString('es-AR');
    if(state.tab==='overview') renderOverview();
    else renderNetwork(state.tab);
  }

  renderAll();
})();
</script>
</body>
</html>
