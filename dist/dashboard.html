<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aluar · Redes Sociales</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid-line:      #e1e0d9;
    --axis-line:      #c3c2b7;
    --border-hair:    rgba(11,11,11,0.10);
    --success:        #006300;
    --danger:         #d03b3b;
    --series-ig:      #2a78d6; /* blue   */
    --series-li:      #008300; /* green  */
    --series-yt:      #e87ba4; /* magenta*/
    --series-1:       #2a78d6;
    --shadow-card:    0 1px 2px rgba(11,11,11,0.05), 0 2px 10px rgba(11,11,11,0.05);
    --shadow-sticky:  0 2px 10px rgba(11,11,11,0.07);
    --surface-2:      #f1f0ea;
    --cat-1: #2a78d6; --cat-2: #008300; --cat-3: #e87ba4; --cat-4: #eda100; --cat-5: #1baf7a; --cat-6: #898781;
    --series-web: #eb6834;
    --series-gads: #7c5cd6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid-line:      #2c2c2a;
      --axis-line:      #383835;
      --border-hair:    rgba(255,255,255,0.10);
      --success:        #0ca30c;
      --danger:         #e66767;
      --series-ig:      #3987e5;
      --series-li:      #008300;
      --series-yt:      #d55181;
      --series-1:       #3987e5;
      --shadow-card:    0 1px 2px rgba(0,0,0,0.35), 0 2px 10px rgba(0,0,0,0.28);
      --shadow-sticky:  0 2px 12px rgba(0,0,0,0.35);
      --surface-2:      #242422;
      --cat-1: #3987e5; --cat-2: #008300; --cat-3: #d55181; --cat-4: #c98500; --cat-5: #199e70; --cat-6: #898781;
      --series-web: #d95926;
      --series-gads: #a48ae8;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid-line:      #2c2c2a;
    --axis-line:      #383835;
    --border-hair:    rgba(255,255,255,0.10);
    --success:        #0ca30c;
    --danger:         #e66767;
    --series-ig:      #3987e5;
    --series-li:      #008300;
    --series-yt:      #d55181;
    --series-1:       #3987e5;
    --shadow-card:    0 1px 2px rgba(0,0,0,0.35), 0 2px 10px rgba(0,0,0,0.28);
    --shadow-sticky:  0 2px 12px rgba(0,0,0,0.35);
    --surface-2:      #242422;
    --cat-1: #3987e5; --cat-2: #008300; --cat-3: #d55181; --cat-4: #c98500; --cat-5: #199e70; --cat-6: #898781;
    --series-web: #d95926;
    --series-gads: #a48ae8;
  }

  * { box-sizing: border-box; }
  .viz-root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
    min-height: 100%;
    padding: 20px 20px 48px;
  }
  .page { max-width: 1180px; margin: 0 auto; }

  .header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .header .brand { display: flex; align-items: center; gap: 14px; }
  .header .logo { height: 52px; width: auto; display: block; flex-shrink: 0; }
  .header h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
  .header .sub { color: var(--text-secondary); font-size: 13px; }
  .header .meta { text-align: right; font-size: 12px; color: var(--text-muted); }

  .controls-sticky {
    position: sticky; top: 0; z-index: 20; background: var(--page-plane);
    padding-top: 4px; margin: 0 -20px; padding-left: 20px; padding-right: 20px;
    box-shadow: var(--shadow-sticky);
  }

  .bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: var(--surface-1); border: 1px solid var(--border-hair);
    border-radius: 10px; padding: 8px 10px; margin-bottom: 14px;
    box-shadow: var(--shadow-card);
  }
  .bar .grp { display:flex; gap:6px; flex-wrap: wrap; }
  button.chip {
    font: inherit; font-size: 12.5px; cursor: pointer; color: var(--text-secondary);
    background: transparent; border: 1px solid var(--border-hair); border-radius: 999px;
    padding: 5px 12px; white-space: nowrap;
  }
  button.chip:hover { background: var(--grid-line); }
  button.chip.active { background: var(--series-1); color: #fff; border-color: var(--series-1); font-weight: 600; }
  .bar input[type=date] {
    font: inherit; font-size: 12.5px; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border-hair); border-radius: 6px; padding: 4px 6px;
  }
  .bar .sep { width: 1px; align-self: stretch; background: var(--border-hair); margin: 0 4px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 0; padding-bottom: 12px; border-bottom: 1px solid var(--border-hair); }
  .tabs button {
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    background: transparent; border: none; color: var(--text-secondary);
    padding: 9px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button.active { color: var(--text-primary); border-bottom-color: var(--series-1); }

  main#content { margin-top: 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border-hair); border-radius: 10px;
    padding: 12px 14px; box-shadow: var(--shadow-card);
    border-left: 3px solid var(--tile-accent, transparent);
  }
  .tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .value { font-size: 24px; font-weight: 600; line-height: 1.1; }
  .tile .delta { font-size: 12px; margin-top: 5px; font-weight: 600; }
  .tile .delta.up { color: var(--success); }
  .tile .delta.down { color: var(--danger); }
  .tile .delta.flat { color: var(--text-muted); }

  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .cards.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cards .card.wide { grid-column: 1 / -1; }
  @media (max-width: 700px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface-1); border: 1px solid var(--border-hair); border-radius: 10px;
    padding: 14px 16px 8px; overflow: hidden; box-shadow: var(--shadow-card);
  }
  .card h3 { font-size: 13.5px; margin: 0 0 2px; font-weight: 600; }
  .card .cap { font-size: 11.5px; color: var(--text-muted); margin-bottom: 6px; }
  .card .toggle {
    float: right; font-size: 11px; color: var(--text-secondary); cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px; background:none; border:none; font-family:inherit;
  }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); margin: 2px 0 6px; flex-wrap: wrap; }
  .legend .key { display: inline-flex; align-items: center; gap: 5px; }
  .legend .swatch { width: 14px; height: 2px; border-radius: 2px; display:inline-block; }

  .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 12px; margin-bottom: 16px; }
  .donut-body { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .donut-body svg { flex-shrink: 0; }
  .donut-legend { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-secondary); flex: 1; min-width: 140px; }
  .donut-legend .key { display: flex; align-items: center; gap: 7px; justify-content: space-between; }
  .donut-legend .key .name { display: flex; align-items: center; gap: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .donut-legend .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; display:inline-block; }
  .donut-legend .pct { font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .chart-wrap { position: relative; }
  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  .gridline { stroke: var(--grid-line); stroke-width: 1; }
  .axisline { stroke: var(--axis-line); stroke-width: 1; }
  .tick-label { fill: var(--text-muted); font-size: 10.5px; }
  .end-label { fill: var(--text-primary); font-size: 11px; font-weight: 600; }
  .crosshair { stroke: var(--text-muted); stroke-width: 1; opacity: 0; pointer-events: none; }
  .hit-rect { fill: transparent; cursor: crosshair; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 50; opacity: 0;
    background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border-hair); border-radius: 8px;
    padding: 7px 10px; font-size: 11.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
    white-space: nowrap; transition: opacity .06s linear;
  }
  .tooltip .t-date { color: var(--text-muted); font-size: 10.5px; margin-bottom: 3px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 6px; }
  .tooltip .t-key { width: 9px; height: 2px; border-radius: 2px; display: inline-block; }
  .tooltip .t-val { font-weight: 700; margin-left: auto; padding-left: 10px; font-variant-numeric: tabular-nums; }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.data-table caption { display:none; }
  table.data-table th, table.data-table td {
    text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--grid-line);
    vertical-align: top;
  }
  table.data-table thead th { color: var(--text-secondary); font-weight: 700; font-size: 11.5px; background: var(--surface-2); border-bottom: 1px solid var(--axis-line); }
  table.data-table thead th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  table.data-table thead th.sortable:hover { color: var(--text-primary); }
  table.data-table tbody tr:nth-child(even) td { background: var(--surface-2); }
  table.data-table td.num, table.data-table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.data-table td.content-cell { max-width: 340px; }
  table.data-table td.content-cell .txt {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--text-secondary); font-size: 12px;
  }
  table.data-table a { color: var(--series-1); text-decoration: none; }
  table.data-table a:hover { text-decoration: underline; }
  .table-scroll { overflow-x: auto; }

  .highlight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 12px; margin-bottom: 16px; }
  .hl-card { background: var(--surface-1); border: 1px solid var(--border-hair); border-left: 3px solid var(--hl-accent, transparent); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow-card); }
  .hl-card .net { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--text-secondary); margin-bottom: 6px; }
  .hl-card .txt { font-size: 13px; color: var(--text-primary); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .hl-card .stats { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; }
  .hl-card .stats b { color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .hl-card a.go { font-size: 12px; }

  footer.foot { margin-top: 20px; font-size: 11.5px; color: var(--text-muted); text-align: center; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>

entonces, cada etapa nos acercó a una energía más limpia y diversificada. \n\n👉Deslizá y conocé nuestra historia \n\n#aluar #aluaraluminio #peal","url":"https://www.instagram.com/p/DbLdJQlE80U/","type":"FEED_CAROUSEL_ALBUM","comments":2,"interactions":101,"likes":92,"reach":1196,"saved":5,"shares":2,"views":3029},{"date":"2026-07-13","content":"Un nuevo paso en nuestro compromiso con el desarrollo energético del país ⚡\n\nObtuvimos la adjudicación para desarrollar un sistema de almacenamiento de energía mediante baterías (BESS - Battery Energy Storage System) de 50 MW en la ciudad de Goya, Corrientes.\n\n¿Sabés de qué se trata este sistema? 👀\n\n¡Deslizá las imágenes para conocer qué son y cuál es el impacto positivo de este nuevo proyecto!","url":"https://www.instagram.com/p/DavXd2QEfSX/","type":"FEED_CAROUSEL_ALBUM","comments":4,"interactions":113,"likes":95,"reach":1472,"saved":7,"shares":7,"views":3471},{"date":"2026-07-08","content":"Nos preparamos para las vacaciones de invierno y por eso abrimos las puertas de nuestra Planta de Aluminio en Puerto Madryn y del Parque Eólico para recibir visitas de la comunidad.\n\nJunto con la Secretaría de Turismo de Puerto Madryn organizamos nuevamente esta actividad gratuita desde el 13 al 31 de julio. Una propuesta tanto para turistas como para residentes de la ciudad.\n\nVisitas a la Planta de Aluminio Aluar\n\n📅 Comienzan el lunes 13/7 y se realizarán todos los lunes y miércoles a las 9.30hs.\n⏱️Duración aproximada 2 hs.\n✨Actividad gratuita\nCupo limitado: 32 personas. \n👨‍👩‍👦Menores de 18 años deberán estar acompañados de una persona mayor.\n\nVisitas al Parque Eólico Aluar\n\n📅 Comienzan el viernes 17/7 y se realizarán todos los viernes a las 14hs.\n⏱️Duración aproximada 2.30 hs \n✨Actividad gratuita\nCupo limitado: 23 personas\n👨‍👩‍👦Menores de 18 años deberán estar acompañados de una persona mayor.\n\nInscripción previa en la Secretaría de Turismo, ubicada en Av. Roca 223, en el horario de 8:30 a 20 horas, o hasta agotar las plazas disponibles. El punto de encuentro para cada salida será la Fuente de la Ciudad, en Av. Roca y 28 de Julio.\n \n📲 Para más información, pueden consultar por WhatsApp al:\n(280) 506-7724 / (280) 466-5688 de 8:30 a 20:00.","url":"https://www.instagram.com/p/DaiPPQEmRKI/","type":"FEED_IMAGE","comments":1,"interactions":79,"likes":50,"reach":1782,"saved":10,"shares":18,"views":3286},{"date":"2026-07-01","content":"Detrás de cada proceso, hay personas que hacen posible nuestro aluminio 🙌\n\nHoy en #AluarEnPrimeraPersona les presentamos a Diego, Oficial de Cátodos en Puerto Madryn.\n\n¡Deslizá las imágenes para conocer su trabajo!\n\n#aluar #aluminioargentino","url":"https://www.instagram.com/p/DaQJAHHkx42/","type":"FEED_CAROUSEL_ALBUM","comments":5,"interactions":330,"likes":289,"reach":5219,"saved":18,"shares":18,"views":12064},{"date":"2026-06-26","content":"En junio los chicos de Madryn reciben a las ballenas 🐋\n\nComo todos los años, acompañamos a la Secretaria de Turismo de Puerto Madryn, en esta actividad que organizan junto a todos los alumnos de cuarto grado de todos los colegios de la ciudad.\n\nEl propósito de la actividad es generar conciencia respecto a la conservación del ambiente y del\nárea de reproducción de la Ballena Franca Austral.\n\nEn el marco de esta propuesta se dan charlas en los colegios y se finaliza con una visita al área\nprotegida municipal El Doradillo donde se avistan a las ballenas y luego se comparte un chocolate caliente ☕\n\n#comunidad #puertomadryn #ballenas #educación","url":"https://www.instagram.com/p/DaDl71ekbfC/","type":"FEED_CAROUSEL_ALBUM","comments":0,"interactions":99,"likes":90,"reach":1686,"saved":2,"shares":7,"views":3981},{"date":"2026-06-23","content":"¡El aspa de un aerogenerador es mucho más grande de lo que te imaginás! 😮\n\nDeslizá y enterate👉","url":"https://www.instagram.com/p/DZ7h7_XkT1y/","type":"FEED_CAROUSEL_ALBUM","comments":3,"interactions":219,"likes":190,"reach":3515,"saved":6,"shares":20,"views":8376},{"date":"2026-06-16","content":"⚽ El aluminio también entra a la cancha. Está en los tacos de los botines, los arcos y hasta en los bancos de suplentes 🥅\n\nLiviano, resistente y listo para jugar este mundial. \n\n#Aluar #Aluminioargentino","url":"https://www.instagram.com/p/DZpnFRPDiuG/","type":"FEED_CAROUSEL_ALBUM","comments":1,"interactions":101,"likes":91,"reach":1547,"saved":5,"shares":4,"views":3719},{"date":"2026-05-27","content":"Realizamos la 6ta edición de Juntos por Buenas Causas, el programa que impulsamos para acompañar iniciativas con impacto positivo en nuestras comunidades.\n\nEn esta edición, la temática elegida por la comunidad fue “Educación de Calidad”, centrada en el ODS 4 de los Objetivos de Desarrollo Sostenible de la ONU 📚\n\nSe recibieron 52 proyectos de los cuales 9 fueron seleccionados. Estas iniciativas se desarrollarán durante el segundo semestre de 2026, articulando el trabajo de 14 instituciones públicas y privadas de Puerto Madryn, Dolavon, 28 de Julio y Esquel.\n\nA través de Juntos por Buenas Causas seguimos promoviendo más oportunidades de aprendizaje, inclusión y equidad para la comunidad.","url":"https://www.instagram.com/p/DY1-whdGdRw/","type":"FEED_IMAGE","comments":3,"interactions":121,"likes":111,"reach":2984,"saved":3,"shares":4,"views":5450},{"date":"2026-05-18","content":"Las materias primas que utilizamos para producir nuestro aluminio son sumamente importantes. Son el primer paso de toda la cadena de valor 🙌\n\nPero ¿Sabés cuáles son?\n\nDeslizá las imágenes para conocer las principales materias primas que trabajamos en Aluar.\n\n#aluar #aluaraluminio #materiasprimas","url":"https://www.instagram.com/p/DYe19iWGTvq/","type":"FEED_CAROUSEL_ALBUM","comments":0,"interactions":72,"likes":66,"reach":1466,"saved":5,"shares":1,"views":3478},{"date":"2026-05-08","content":"Llegar al espacio es uno de los mayores hitos de la humanidad. Y el aluminio está presente en cada paso de ese camino 👨‍🚀\n\nLigero, resistente y versátil, es un material clave en la industria aeroespacial. Un aliado que transforma ideas en posibilidades y nos acerca a lo que alguna vez parecía imposible 🌕\n\nSin dudas, un aliado de nuestra imaginación. El aluminio nos permite llegar a escenarios impensados. \n\nA menos de un mes de esta expedición... ¿Qué sentís al ver las imágenes que nos dejó el Artemis II? 🚀","url":"https://www.instagram.com/p/DYFTkpToH2J/","type":"FEED_CAROUSEL_ALBUM","comments":0,"interactions":151,"likes":141,"reach":1850,"saved":3,"shares":7,"views":4386},{"date":"2026-04-30","content":"✨ Comenzó el Ciclo de Capacitaciones 2026 ✨\n\nJunto a la UTN – Facultad Regional Chubut, dimos inicio a una propuesta pensada para fortalecer la gestión, la organización y la planificación de las organizaciones sociales de nuestra comunidad 🤝\n\nEmpezamos con el Módulo 1: Comunicación efectiva, escucha activa y trabajo en equipo, un espacio de intercambio y aprendizaje colectivo que pone en valor el trabajo colaborativo 💬🙌\n\nDurante el mes de agosto se desarrollará el Módulo 2:  Finanzas para organizaciones sociales y durante noviembre el Módulo 3: Elaboración de proyectos sociales.\n\nSeguimos construyendo comunidad y fortaleciendo el entramado social 💙\n\n#comunidad #aluar #aluaraluminio","url":"https://www.instagram.com/p/DXwai9omWWN/","type":"FEED_CAROUSEL_ALBUM","comments":0,"interactions":148,"likes":133,"reach":3532,"saved":2,"shares":13,"views":8662},{"date":"2026-04-28","content":"En Aluar hay palabras que tienen un significado más allá de una definición. \n\nHoy te compartimos la primera palabra del Diccionario Aluar.\n\nDeslizá la imagen para saber de cuál hablamos. ¿La conocías? \n\nDejanos este emoji en comentarios si tu respuesta es sí 😎 y este si no tenías idea 😬","url":"https://www.instagram.com/p/DXrX3yTGSdk/","type":"FEED_CAROUSEL_ALBUM","comments":2,"interactions":44,"likes":40,"reach":1368,"saved":2,"shares":null,"views":2974},{"date":"2026-04-20","content":"Invertir es proyectar el futuro.\n\nSeguimos impulsando proyectos estratégicos que fortalecen nuestra capacidad productiva y el desarrollo energético del país⚡\n\nEnergía renovable, infraestructura y crecimiento sostenible para seguir produciendo aluminio argentino para el mundo\n\n#aluar #aluaraluminio #inversion","url":"https://www.instagram.com/p/DXWygNoDYA9/","type":"FEED_CAROUSEL_ALBUM","comments":2,"interactions":77,"likes":69,"reach":1318,"saved":3,"shares":3,"views":2824},{"date":"2026-04-16","content":"¿Sabías que la pureza de nuestro aluminio primario alcanza el 99,86%? \n\nSi, y esta cualidad es la razón principal por la cual nuestro producto es elegido en los mercados más exigentes del mundo. \n\nPara lograr este nivel de calidad invertimos en tecnología, innovación y capacitación de nuestro personal. Todo esto bajo los estándares más exigentes para cumplir con una producción responsable. \n\nConocé más sobre nuestro aluminio en nuestra web (link en bio)\n\n#aluminio #purezadelaluminio #aluar","url":"https://www.instagram.com/p/DXMfZqyE82q/","type":"FEED_IMAGE","comments":1,"interactions":80,"likes":78,"reach":1578,"saved":1,"shares":null,"views":2820},{"date":"2026-04-14","content":"Un gran paso para la educación en Puerto Madryn 🙌\n\nSe firmó el acuerdo institucional entre el Ministerio de Educación del Chubut, la Municipalidad y la Fundación Aurora Austral, junto con la donación del terreno donde se construirá la nueva escuela en el Barrio Perón.\n\nEste acuerdo sienta las bases de un proyecto con un enfoque colaborativo entre el sector público, municipal y privado 🤝\n\nLa escuela comenzará el nivel inicial en 2027 y contará con los tres niveles una vez construída en su totalidad. \n\nSe trata de una propuesta abierta a la comunidad, pensada para acompañar a las familias y preparar a los estudiantes para el futuro laboral.\n\n#aluar #comunidad #educacionpuertomadryn","url":"https://www.instagram.com/p/DXHxGM9gSaP/","type":"FEED_IMAGE","comments":7,"interactions":356,"likes":313,"reach":7703,"saved":15,"shares":21,"views":12945},{"date":"2026-03-31","content":"🎉 Acompañamos el lanzamiento de la edición del 10° aniversario de Mayma en un encuentro que puso en valor el emprendedurismo con propósito, como motor de transformación social y comunitaria.\n\nLa jornada contó con la presencia de Gino Tubaro, referente internacional en innovación social y creador de Atomic Lab, proyecto que entregó de forma gratuita más de 1.300 prótesis impresas en 3D en 44 países 🌍✨\n\nCuando apoyamos a quienes emprenden con propósito, crece la comunidad y se multiplica el impacto positivo en la región. ✨\n\n#comunidad #aluar #aniversariomayma","url":"https://www.instagram.com/p/DWjfu1imQYV/","type":"FEED_CAROUSEL_ALBUM","comments":3,"interactions":80,"likes":74,"reach":1933,"saved":1,"shares":2,"views":4584},{"date":"2026-03-05","content":"En el Día Mundial de la Eficiencia Energética renovamos nuestro compromiso con un consumo más responsable ⚡️\n\n🙌🏼 ¡Deslizá las imágenes para conocer cómo lo hacemos!\n\n#energia #eficiencia #aluar","url":"https://www.instagram.com/p/DVgyf-TkQXt/","type":"FEED_CAROUSEL_ALBUM","comments":1,"interactions":98,"likes":85,"reach":1164,"saved":9,"shares":3,"views":2482},{"date":"2026-02-18","content":"Nuestra principal actividad es producir aluminio 👷‍♂️\n\nY eso quiere decir que trabajamos para ser parte de tu día, porque el aluminio es un material presente en muchas más cosas de lo que imaginas. \n\nMirá a tu alrededor ¿qué cosas te rodean y están hechas de aluminio? Contanos en comentarios!👇","url":"https://www.instagram.com/p/DU5tkpnkvVT/","type":"FEED_CAROUSEL_ALBUM","comments":3,"interactions":113,"likes":105,"reach":2130,"saved":3,"shares":2,"views":4482},{"date":"2026-02-12","content":"En Aluar creemos que es posible producir cuidando el medio ambiente y la comunidad.\nY lo hacemos llevando a cabo proyectos que piensan en futuro 🌎\n\nPor eso anunciamos el lanzamiento de la construcción de una Planta Desalinizadora de agua en Puerto Madryn.\n\nEsta iniciativa permitirá contar con una fuente sostenible de agua apta, tanto para los procesos industriales como para el consumo dentro del predio, reduciendo la demanda sobre el Río Chubut y promoviendo un uso más responsable de este recurso especial. \n\nSi pensamos en una industria que cuide el ambiente, la respuesta está en el agua 💧","url":"https://www.instagram.com/p/DUqKLoID0LJ/","type":"FEED_IMAGE","comments":4,"interactions":80,"likes":75,"reach":1718,"saved":1,"shares":null,"views":2843},{"date":"2026-02-03","content":"El deporte es un camino de evolución constante \nCada disciplina avanza en la búsqueda de mayor precisión y rendimiento en cada movimiento 🎯\nEn ese proceso, el aluminio cumple un rol clave: su ligereza, resistencia y capacidad de adaptación permiten acompañar el desempeño incluso en contextos de alta exigencia ⚙️\nHoy, además, esa evolución incorpora una mirada responsable, donde la durabilidad y la sostenibilidad también forman parte del desarrollo 🌱♻️\n\n👉 Deslizá el carrete y descubrí cómo el aluminio es un aliado de numerosas prácticas deportivas.","url":"https://www.instagram.com/p/DUTL1g2kvxL/","type":"FEED_CAROUSEL_ALBUM","comments":0,"interactions":69,"likes":64,"reach":1933,"saved":5,"shares":null,"views":3958},{"date":"2026-01-28","content":"Recibimos en nuestra Planta de Puerto Madryn a estudiantes de la carrera de Ingeniería Química, cátedra de Electroquímica, de la Universidad Nacional del Sur 🧪\n\nDurante su visita recorrimos nuestras instalaciones y les contamos sobre nuestros procesos productivos y cómo aplicamos la electroquímica en nuestras operaciones.\n\n👉También realizamos una simulación de entrevista grupal que les permitió conocer herramientas de desarrollo profesional y acercarlos a experiencias reales en el ámbito laboral.\n\nEs un orgullo abrir nuestras puertas para construir conocimiento y fortalecer el vínculo con la comunidad académica 🙌\n\n#aluar #aluaraluminio #comunidad","url":"https://www.instagram.com/p/DUDiZvPAu1j/","type":"FEED_CAROUSEL_ALBUM","comments":2,"interactions":243,"likes":221,"reach":4443,"saved":4,"shares":16,"views":10638},{"date":"2026-01-24","content":"Hoy se celebra el Día Internacional de la Educación y desde Aluar lo conmemoramos junto a las instituciones, colegios y fundaciones con quienes colaboramos, día a día, para construir una educación de calidad 👨‍🏫\n\n📍Uno de ellos es el Colegio Madre Teresa, ubicado en San Fernando, prov. de Buenos Aires. Desde 2002, apoyamos su construcción, puesta en marcha y funcionamiento. \n\n👉Actualmente, el Colegio brinda educación integral a más de 700 niños y jóvenes en contexto de vulnerabilidad de nivel inicial, primario y secundario en jornada completa, con asistencia alimentaria, sanitaria y personal.\n\nEn 2025, creamos la Fundación Aurora Austral para seguir fortaleciendo \nla educación a través de la construcción de una nueva escuela en Puerto Madryn.\n\n📖Estamos orgullosos de seguir trabajando para construir futuro.","url":"https://www.instagram.com/p/DT5PJMIDtRa/","type":"FEED_IMAGE","comments":0,"interactions":32,"likes":32,"reach":1643,"saved":0,"shares":null,"views":2700},{"date":"2026-01-22","content":"Empezamos el verano abriendo las puertas de nuestra planta y del Parque Eólico Aluar para recibir a turistas y residentes 🌞🚐\n\nEn conjunto con la Secretaría de Turismo de la Municipalidad de Puerto Madryn creamos este programa de verano para que, quienes lo deseen, puedan visitarnos de manera gratuita 🙌\n\n👉 La iniciativa estará vigente durante enero y febrero, con el objetivo de ofrecer una experiencia única a la comunidad.\n\nA través de estas visitas, los participantes podrán conocer en profundidad cómo se produce el aluminio en la ciudad y el funcionamiento de uno de los principales proyectos locales de energías renovables del país.\n\n📍 Horarios de visita a la planta\nLunes y miércoles a las 9.30 h y 14 h\n\n📍 Horario de visita al Parque Eólico Aluar\nViernes a las 9.30 h\n\n❗ Las inscripciones deberán realizarse de manera presencial en la Secretaría de Turismo (Av. Roca 223, Puerto Madryn), de 8.30 a 21 h, durante la semana correspondiente a las salidas previstas.\nLos cupos se habilitan semanalmente y son limitados.\n\n#visitasguiadas #aluar #aluaraluminioargentino","url":"https://www.instagram.com/p/DT0aqLdjJUI/","type":"FEED_CAROUSEL_ALBUM","comments":5,"interactions":135,"likes":108,"reach":2392,"saved":9,"shares":13,"views":5183},{"date":"2026-01-20","content":"La seguridad es una de los pilares más importantes de una empresa 👷‍♂️Y en Aluar creemos que el bienestar de las personas que trabajan con nosotros es sumamente importante. \n\n👉Hoy queremos presentarles nuestro Programa de Simulacros.\n\n✅ Se trata de una herramienta central en nuestra estrategia de preparación. \n\n📊Su ejecución permite mantener entrenado al equipo de respuesta y detectar oportunidades de mejora, que son registradas en informes específicos y gestionados mediante planes de acción.\n\n👩‍⚕️Además, se desarrollan entrenamientos especializados para la integración de equipos multidisciplinarios en escenarios complejos, incluyendo incidentes con múltiples víctimas, involucrando a médicos, enfermeros, brigadistas, personal de vigilancia y coordinadores de planta.\n\n🙌Te invitamos a conocer más acerca de las acciones que llevamos a cabo en materia de seguridad en nuestro Reporte de Sostenibilidad 2024- 2025 (link en bio)\n\n#aluar #aluaraluminioargentino","url":"https://www.instagram.com/p/DTvC1lLgT45/","type":"FEED_IMAGE","comments":0,"interactions":95,"likes":91,"reach":3041,"saved":1,"shares":3,"views":5319},{"date":"2026-01-07","content":"El aluminio es un aliado para el verano por muchos motivos 🌡️🙌\n\n🌞Deslizá las imágenes para conocer algunas de las características que hacen que este material sea uno de los más elegidos en esta época","url":"https://www.instagram.com/p/DTNwvBJF4Hl/","type":"FEED_CAROUSEL_ALBUM","comments":2,"interactions":65,"likes":55," ntos De Luca","watchUrl":"https://www.youtube.com/watch?v=t200lcY53-Q","views":418,"watchMinutes":652.7440166666665,"likes":15,"comments":0}]},"web":{"sources":[{"label":"youtube.com","pct":64.74},{"label":"Directo","pct":14.47},{"label":"google.com","pct":9.85},{"label":"aluar.com.ar","pct":3.99},{"label":"facebook.com","pct":1.94},{"label":"Otros","pct":5.01}],"topPages":[{"page":"/","views":183175},{"page":"/sostenibilidad","views":182902},{"page":"/soluciones-arquitectura","views":54208},{"page":"/area-profesionales-catalogos-tecnicos","views":34154},{"page":"/area-profesionales","views":26061},{"page":"/contacto","views":23776},{"page":"/novedades","views":17672},{"page":"/seccion/mercados/5/5","views":17378}]}}</script>
<script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById('dataset').textContent);

  const NET_COLOR = { instagram: 'var(--series-ig)', linkedin: 'var(--series-li)', youtube: 'var(--series-yt)' };
  const NET_LABEL = { instagram: 'Instagram', linkedin: 'LinkedIn', youtube: 'YouTube' };

  function fmtCompact(n){
    if(n === null || n === undefined || Number.isNaN(n)) return '—';
    const sign = n < 0 ? '-' : '';
    const abs = Math.abs(n);
    if(abs >= 1e6) return sign + trimZero((abs/1e6).toFixed(1)) + 'M';
    if(abs >= 1e4) return sign + trimZero((abs/1e3).toFixed(1)) + 'K';
    return sign + Math.round(abs).toLocaleString('es-AR');
  }
  function trimZero(s){ return s.replace(/\.0$/, ''); }
  function fmtInt(n){ if(n===null||n===undefined) return '—'; return Math.round(n).toLocaleString('es-AR'); }
  function fmtPct(n, digits){ if(n===null||n===undefined||Number.isNaN(n)) return '—'; return n.toFixed(digits===undefined?1:digits) + '%'; }
  function fmtDateShort(iso){ const [y,m,d]=iso.split('-'); return d+'/'+m; }
  function fmtDateLong(iso){ const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function sum(arr, key){ let s = 0, any=false; for(const r of arr){ if(r[key]!=null){ s += r[key]; any=true; } } return any ? s : null; }
  function lastVal(arr, key){ for(let i=arr.length-1;i>=0;i--){ if(arr[i][key]!=null) return arr[i][key]; } return null; }
  function firstVal(arr, key){ for(let i=0;i<arr.length;i++){ if(arr[i][key]!=null) return arr[i][key]; } return null; }

  // ---------- date range handling ----------
  const allDatesIG = DATA.evolution.instagram.map(r=>r.date);
  const MAX_DATE = allDatesIG[allDatesIG.length-1];
  const MIN_DATE = allDatesIG[0];

  function addDays(iso, n){
    const d = new Date(iso+'T00:00:00Z');
    d.setUTCDate(d.getUTCDate()+n);
    return d.toISOString().slice(0,10);
  }
  function daysBetween(a,b){
    return Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/86400000);
  }
  function clampMin(iso){ return iso < MIN_DATE ? MIN_DATE : iso; }

  const PRESETS = [
    { key:'7d', label:'7 días', from: addDays(MAX_DATE,-6) },
    { key:'30d', label:'30 días', from: addDays(MAX_DATE,-29) },
    { key:'90d', label:'90 días', from: addDays(MAX_DATE,-89) },
    { key:'365d', label:'12 meses', from: clampMin(addDays(MAX_DATE,-364)) },
  ];

  const state = {
    tab: 'overview',
    preset: '30d',
    from: PRESETS[1].from,
    to: MAX_DATE,
  };

  function inRange(r){ return r.date >= state.from && r.date <= state.to; }
  function prevPeriod(){
    const len = daysBetween(state.from, state.to) + 1;
    const to = addDays(state.from, -1);
    const from = addDays(to, -(len-1));
    return { from: clampMin(from), to };
  }

  // ---------- filter bar ----------
  function renderFilterBar(){
    const el = document.getElementById('filter-bar');
    el.innerHTML = '';
    const adsTabActive = state.tab === 'ads';
    if(adsTabActive){
      const note = document.createElement('div');
      note.style.cssText = 'font-size:11.5px;color:var(--danger);font-weight:700;width:100%';
      note.textContent = '⚠ Este selector no aplica en la pestaña Publicidad — esos datos son un total fijo, no un rango.';
      el.appendChild(note);
    }
    // Wrap the actual controls so dimming/disabling them (when on the Ads
    // tab, where none of this applies) doesn't also fade the warning above.
    const controls = document.createElement('div');
    controls.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%' +
      (adsTabActive ? ';opacity:0.45;pointer-events:none' : '');
    el.appendChild(controls);

    const grp = document.createElement('div'); grp.className = 'grp';
    PRESETS.forEach(p=>{
      const b = document.createElement('button');
      b.className = 'chip' + (state.preset===p.key ? ' active':'');
      b.textContent = p.label;
      b.onclick = () => { state.preset = p.key; state.from = p.from; state.to = MAX_DATE; renderAll(); };
      grp.appendChild(b);
    });
    controls.appendChild(grp);
    const sep = document.createElement('div'); sep.className='sep'; controls.appendChild(sep);

    const custom = document.createElement('div'); custom.className='grp';
    const fromI = document.createElement('input'); fromI.type='date'; fromI.value = state.from; fromI.min = MIN_DATE; fromI.max = state.to;
    const toI = document.createElement('input'); toI.type='date'; toI.value = state.to; toI.min = state.from; toI.max = MAX_DATE;
    fromI.onchange = () => { state.preset='custom'; state.from = fromI.value; renderAll(); };
    toI.onchange = () => { state.preset='custom'; state.to = toI.value; renderAll(); };
    custom.appendChild(fromI);
    const dash = document.createElement('span'); dash.textContent='–'; dash.style.color='var(--text-muted)'; custom.appendChild(dash);
    custom.appendChild(toI);
    controls.appendChild(custom);
  }

  // ---------- tabs ----------
  const TABS = [
    { key:'overview', label:'Resumen' },
    { key:'instagram', label:'Instagram' },
    { key:'linkedin', label:'LinkedIn' },
    { key:'youtube', label:'YouTube' },
    { key:'web', label:'Sitio Web' },
  ];
  function renderTabs(){
    const el = document.getElementById('tabs');
    el.innerHTML = '';
    TABS.forEach(t=>{
      const b = document.createElement('button');
      b.textContent = t.label;
      b.className = state.tab===t.key ? 'active' : '';
      b.onclick = () => { state.tab = t.key; renderAll(); };
      el.appendChild(b);
    });
  }

  // ---------- stat tile ----------
  function statTile(label, value, delta, opts){
    opts = opts || {};
    const div = document.createElement('div');
    div.className = 'tile';
    const deltaHtml = (delta===null||delta===undefined) ? '' :
      `<div class="delta ${delta>0?'up':delta<0?'down':'flat'}">${delta>0?'▲':delta<0?'▼':'·'} ${opts.deltaIsPct ? fmtPct(Math.abs(delta)) : fmtCompact(Math.abs(delta))} ${opts.deltaSuffix||'vs. período anterior'}</div>`;
    div.innerHTML = `<div class="label">${escapeHtml(label)}</div><div class="value">${value}</div>${deltaHtml}`;
    if(opts.accent) div.style.setProperty('--tile-accent', opts.accent);
    return div;
  }

  // ---------- mini bar chart (cross-network comparison) ----------
  // Renders a small set of horizontal bars (one per network) into an existing
  // card container. Each bar has its own scale (bar length relative to the
  // max within this metric only) — never compare across metrics of different units.
  function renderMiniBars(container, items){
    const maxV = Math.max(1, ...items.map(it => it.value || 0));
    const rows = document.createElement('div');
    rows.style.cssText = 'display:flex;flex-direction:column;gap:10px;margin-top:4px';
    items.forEach(it => {
      const pct = Math.max(2, (it.value || 0) / maxV * 100);
      const row = document.createElement('div');
      row.innerHTML = `
        <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-secondary);margin-bottom:3px">
          <span>${escapeHtml(it.label)}</span>
          <span style="font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums">${fmtCompact(it.value)}</span>
        </div>
        <div style="height:10px;border-radius:4px;background:var(--grid-line);overflow:hidden">
          <div style="height:100%;width:${pct.toFixed(1)}%;border-radius:4px;background:${it.color}"></div>
        </div>`;
      rows.appendChild(row);
    });
    container.appendChild(rows);
  }

  // ---------- donut chart (demographic breakdowns) ----------
  // items: [{label, pct}], expected pre-sorted desc with any "Otros" bucket last.
  function renderDonutChart(container, items){
    const size = 148, R = 54, strokeW = 22, cx = size/2, cy = size/2;
    const C = 2 * Math.PI * R;
    const colors = ['var(--cat-1)','var(--cat-2)','var(--cat-3)','var(--cat-4)','var(--cat-5)'];
    let cum = 0, circles = '', legendHtml = '', colorIdx = 0;
    items.forEach(it => {
      const color = it.label === 'Otros' ? 'var(--cat-6)' : colors[colorIdx++ % colors.length];
      const segLen = Math.max(0, (it.pct/100) * C);
      circles += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${color}" stroke-width="${strokeW}" stroke-dasharray="${segLen.toFixed(2)} ${(C-segLen).toFixed(2)}" stroke-dashoffset="${(-cum).toFixed(2)}"></circle>`;
      cum += segLen;
      legendHtml += `<div class="key"><span class="name"><span class="swatch" style="background:${color}"></span>${escapeHtml(it.label)}</span><span class="pct">${fmtPct(it.pct)}</span></div>`;
    });
    const top = items.reduce((best, it) => (!best || it.pct > best.pct) ? it : best, null) || { label:'—', pct:0 };
    const topLabel = top.label.length > 13 ? top.label.slice(0,12)+'…' : top.label;
    const wrap = document.createElement('div');
    wrap.className = 'donut-body';
    wrap.innerHTML = `
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <g transform="rotate(-90 ${cx} ${cy})">${circles}</g>
        <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text-primary)">${fmtPct(top.pct)}</text>
        <text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="9.5" fill="var(--text-muted)">${escapeHtml(topLabel)}</text>
      </svg>
      <div class="donut-legend">${legendHtml}</div>`;
    container.appendChild(wrap);
  }

  // ---------- line chart ----------
  let tooltipEl;
  function ensureTooltip(){
    if(!tooltipEl){
      tooltipEl = document.createElement('div');
      tooltipEl.className = 'tooltip';
      document.querySelector('.viz-root').appendChild(tooltipEl);
    }
    return tooltipEl;
  }

  // series: [{name, color, points:[{date,value}], format}]
  function renderLineChart(container, series, opts){
    opts = opts || {};
    const height = opts.height || 200;
    const width = 640;
    const padL = 50, padR = 14, padT = 14, padB = 24;
    // Align all series to a shared date axis — individual series arrays may have
    // gaps or missing trailing/leading dates when a connector has no data for a day.
    const dateSet = new Set();
    series.forEach(s => s.points.forEach(p => dateSet.add(p.date)));
    const dates = Array.from(dateSet).sort();
    series = series.map(s => {
      const byDate = new Map(s.points.map(p => [p.date, p.value]));
      return Object.assign({}, s, { points: dates.map(d => ({ date: d, value: byDate.has(d) ? byDate.get(d) : null })) });
    });
    const n = dates.length;
    let minY = Infinity, maxY = -Infinity;
    series.forEach(s => s.points.forEach(p => { if(p.value!=null){ if(p.value<minY) minY=p.value; if(p.value>maxY) maxY=p.value; } }));
    if(!isFinite(minY)){ minY = 0; maxY = 1; }
    if(minY===maxY){ minY -= 1; maxY += 1; }
    if(opts.bars || opts.startAtZero){
      minY = Math.min(0, minY);
      maxY = maxY + (maxY-minY) * 0.08;
    } else {
      const padValue = (maxY-minY) * 0.08;
      minY -= padValue; maxY += padValue;
    }

    const x = i => padL + (n<=1 ? 0 : (i/(n-1)) * (width-padL-padR));
    const y = v => padT + (1 - (v-minY)/(maxY-minY)) * (height-padT-padB);

    const wrap = document.createElement('div');
    wrap.className = 'chart-wrap';

    // gridlines (4 steps)
    const steps = 4;
    let gridSvg = '';
    for(let i=0;i<=steps;i++){
      const val = minY + (maxY-minY)*i/steps;
      const yy = y(val);
      gridSvg += `<line class="gridline" x1="${padL}" x2="${width-padR}" y1="${yy}" y2="${yy}"></line>`;
      gridSvg += `<text class="tick-label" x="${padL-6}" y="${yy+3}" text-anchor="end">${fmtCompact(val)}</text>`;
    }
    gridSvg += `<line class="axisline" x1="${padL}" x2="${width-padR}" y1="${height-padB}" y2="${height-padB}"></line>`;

    // rounded-top column path: square at the baseline, per mark spec
    function barPath(xLeft, yTop, w, yBase){
      const r = Math.max(0, Math.min(4, w/2, yBase-yTop));
      const xRight = xLeft+w;
      if(r===0) return `M${xLeft},${yBase} L${xLeft},${yTop} L${xRight},${yTop} L${xRight},${yBase} Z`;
      return `M${xLeft},${yBase} L${xLeft},${yTop+r} Q${xLeft},${yTop} ${xLeft+r},${yTop} L${xRight-r},${yTop} Q${xRight},${yTop} ${xRight},${yTop+r} L${xRight},${yBase} Z`;
    }

    let seriesSvg = '';
    series.forEach(s => {
      if(opts.bars){
        const slot = n<=1 ? (width-padL-padR) : (width-padL-padR)/(n-1);
        const barW = Math.max(2, Math.min(24, slot-2));
        const yBase = y(Math.max(minY,0));
        for(let i=0;i<n;i++){
          const p = s.points[i];
          if(p.value==null) continue;
          const xLeft = x(i) - barW/2;
          const yTop = y(p.value);
          seriesSvg += `<path d="${barPath(xLeft, yTop, barW, yBase)}" fill="${s.color}"></path>`;
        }
        return;
      }
      if(opts.scatter){
        for(let i=0;i<n;i++){
          const p = s.points[i];
          if(p.value==null) continue;
          seriesSvg += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3.5" fill="${s.color}"></circle>`;
        }
        return;
      }
      let d = '', pen = false;
      for(let i=0;i<n;i++){
        const p = s.points[i];
        if(p.value==null){ pen = false; continue; }
        const cmd = pen ? 'L' : 'M';
        d += `${cmd}${x(i).toFixed(1)},${y(p.value).toFixed(1)} `;
        pen = true;
      }
      seriesSvg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>`;
      // end dot + label
      for(let i=n-1;i>=0;i--){
        if(s.points[i].value!=null){
          seriesSvg += `<circle cx="${x(i)}" cy="${y(s.points[i].value)}" r="4" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"></circle>`;
          if(series.length===1){
            seriesSvg += `<text class="end-label" x="${x(i)}" y="${y(s.points[i].value)-10}" text-anchor="end">${(s.format||fmtCompact)(s.points[i].value)}</text>`;
          }
          break;
        }
      }
    });

    // x-axis: first / mid / last date labels
    const idxs = n>1 ? [0, Math.floor((n-1)/2), n-1] : [0];
    let xLabels = '';
    idxs.forEach(i => {
      xLabels += `<text class="tick-label" x="${x(i)}" y="${height-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${fmtDateShort(dates[i])}</text>`;
    });

    wrap.innerHTML = `
      <svg class="chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
        ${gridSvg}
        ${seriesSvg}
        ${xLabels}
        <line class="crosshair" x1="0" x2="0" y1="${padT}" y2="${height-padB}"></line>
        <rect class="hit-rect" x="${padL}" y="0" width="${width-padL-padR}" height="${height}"></rect>
      </svg>`;

    const svg = wrap.querySelector('svg');
    const hit = wrap.querySelector('.hit-rect');
    const crosshair = wrap.querySelector('.crosshair');
    const tip = ensureTooltip();

    hit.addEventListener('pointermove', (ev) => {
      const rect = svg.getBoundingClientRect();
      const relX = (ev.clientX - rect.left) / rect.width * width;
      let idx = Math.round(((relX - padL) / (width-padL-padR)) * (n-1));
      idx = Math.max(0, Math.min(n-1, idx));
      crosshair.setAttribute('x1', x(idx)); crosshair.setAttribute('x2', x(idx));
      crosshair.style.opacity = 1;
      let rows = '';
      series.forEach(s => {
        const v = s.points[idx].value;
        rows += `<div class="t-row"><span class="t-key" style="background:${s.color}"></span>${escapeHtml(s.name)}<span class="t-val">${(s.format||fmtCompact)(v)}</span></div>`;
      });
      tip.innerHTML = `<div class="t-date">${fmtDateLong(dates[idx])}</div>${rows}`;
      tip.style.left = (ev.clientX + 14) + 'px';
      tip.style.top = (ev.clientY + 14) + 'px';
      tip.style.opacity = 1;
    });
    hit.addEventListener('pointerleave', () => { crosshair.style.opacity = 0; tip.style.opacity = 0; });

    container.appendChild(wrap);

    if(series.length>1){
      const legend = document.createElement('div'); legend.className='legend';
      series.forEach(s=>{
        legend.innerHTML += `<span class="key"><span class="swatch" style="background:${s.color}"></span>${escapeHtml(s.name)}</span>`;
      });
      container.insertBefore(legend, wrap);
    }

    // table-view toggle
    const table = document.createElement('div');
    table.className = 'table-scroll';
    table.style.display = 'none';
    let thead = '<tr><th>Fecha</th>' + series.map(s=>`<th class="num">${escapeHtml(series.length>1?s.name:'Valor')}</th>`).join('') + '</tr>';
    let tbody = '';
    for(let i=n-1;i>=0;i--){
      tbody += '<tr><td>'+fmtDateLong(dates[i])+'</td>' + series.map(s=>`<td class="num">${(s.format||fmtCompact)(s.points[i].value)}</td>`).join('') + '</tr>';
    }
    table.innerHTML = `<table class="data-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
    container.appendChild(table);

    const toggle = document.createElement('button');
    toggle.className = 'toggle';
    toggle.textContent = 'Ver tabla';
    toggle.onclick = () => {
      const showingTable = table.style.display !== 'none';
      table.style.display = showingTable ? 'none' : 'block';
      wrap.style.display = showingTable ? 'block' : 'none';
      if(legendRef) legendRef.style.display = showingTable ? 'flex' : 'none';
      toggle.textContent = showingTable ? 'Ver tabla' : 'Ver gráfico';
    };
    var legendRef = container.querySelector('.legend');
    container.insertBefore(toggle, container.firstChild.nextSibling);
  }

  function chartCard(title, caption){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3>${escapeHtml(title)}</h3><div class="cap">${escapeHtml(caption||'')}</div>`;
    return card;
  }

  // ---------- top content table ----------
  const TYPE_LABEL = {
    FEED_IMAGE:'Imagen', FEED_CAROUSEL_ALBUM:'Carrusel', REEL:'Reel', VIDEO:'Video',
    IMAGE:'Imagen', POLL:'Encuesta', ARTICLE:'Artículo', DOCUMENT:'Documento',
    TEXT:'Texto', MULTIIMAGE:'Álbum',
  };
  function postLabel(r, network){
    if(r.title && r.title.trim()) return r.title.trim();
    if(r.content && r.content.trim()) return r.content.trim().slice(0,80);
    const kind = TYPE_LABEL[r.type] || (network==='linkedin'?'Publicación':network==='youtube'?'Video':'Publicación');
    return `${kind} · ${fmtDateLong(r.date)}`;
  }
  function postEngagement(r, network){
    if(network==='instagram') return r.reach ? (r.interactions||0)/r.reach*100 : null;
    if(network==='linkedin') return r.impressions ? ((r.likes||0)+(r.comments||0)+(r.shares||0))/r.impressions*100 : null;
    return r.views ? ((r.likes||0)+(r.comments||0))/r.views*100 : null;
  }
  function renderDemographicsSection(container, network){
    const demo = DATA.demographics && DATA.demographics[network];
    if(!demo) return;
    const specs = network==='linkedin'
      ? [['seniority','Antigüedad laboral','Distribución de seguidores por nivel de experiencia.'],
         ['industry','Industria','Distribución de seguidores por rubro.']]
      : [['age','Edad','Distribución de la audiencia por rango etario.'],
         ['gender','Género','Distribución de la audiencia por género.'],
         ['country','País','Principales países de la audiencia.']];
    const grid = document.createElement('div'); grid.className = 'demo-grid';
    specs.forEach(spec => {
      const items = demo[spec[0]];
      if(!items || !items.length) return;
      const card = chartCard(spec[1], spec[2]);
      renderDonutChart(card, items);
      grid.appendChild(card);
    });
    if(!grid.children.length) return;
    container.insertAdjacentHTML('beforeend', '<h3 style="font-size:13.5px;margin:4px 0 10px">Audiencia</h3>');
    container.appendChild(grid);
  }

  function topContentTable(container, network, range){
    const rows = DATA.topContent[network].filter(r => r.date >= range.from && r.date <= range.to);
    const card = document.createElement('div');
    card.className = 'card';
    if(rows.length===0){
      card.innerHTML = `<h3>Publicaciones destacadas</h3><div class="empty">Sin publicaciones en el rango seleccionado.</div>`;
      container.appendChild(card);
      return;
    }
    let cols, defaultKey;
    if(network==='instagram'){
      cols = [['Fecha','date'],['Publicación','title'],['Alcance','reach'],['Interacciones','interactions'],['Engagement','engagement'],['Likes','likes'],['Comentarios','comments'],['Guardados','saved']];
      defaultKey = 'interactions';
    } else if(network==='linkedin'){
      cols = [['Fecha','date'],['Publicación','title'],['Impresiones','impressions'],['Reacciones','likes'],['Comentarios','comments'],['Compartidos','shares'],['Engagement','engagement']];
      defaultKey = 'impressions';
    } else {
      cols = [['Fecha','date'],['Título','title'],['Vistas','views'],['Min. vistos','watchMinutes'],['Likes','likes'],['Comentarios','comments'],['Engagement','engagement']];
      defaultKey = 'views';
    }
    const baseRows = rows.slice().sort((a,b)=>(b[defaultKey]||0)-(a[defaultKey]||0)).slice(0,8);
    const sortState = { key: defaultKey, dir: 'desc' };

    function cellValue(r, key){
      if(key==='engagement') return postEngagement(r, network);
      return r[key];
    }
    function cellHtml(r, key){
      if(key==='date') return `<td>${fmtDateShort(r.date)}</td>`;
      if(key==='title'){
        const label = postLabel(r, network);
        const href = r.watchUrl || r.url;
        return href ? `<td class="content-cell"><a href="${href}" target="_blank" rel="noopener">${escapeHtml(label)}</a></td>` : `<td class="content-cell">${escapeHtml(label)}</td>`;
      }
      if(key==='engagement') return `<td class="num">${fmtPct(postEngagement(r, network))}</td>`;
      return `<td class="num">${fmtCompact(r[key])}</td>`;
    }
    function sortedRows(){
      return baseRows.slice().sort((a,b)=>{
        if(sortState.key==='date'){
          return sortState.dir==='asc' ? (a.date<b.date?-1:a.date>b.date?1:0) : (a.date<b.date?1:a.date>b.date?-1:0);
        }
        const av = cellValue(a, sortState.key), bv = cellValue(b, sortState.key);
        const an = (av==null||Number.isNaN(av)) ? -Infinity : av, bn = (bv==null||Number.isNaN(bv)) ? -Infinity : bv;
        return sortState.dir==='asc' ? an-bn : bn-an;
      });
    }
    function renderTbody(){
      return sortedRows().map(r => '<tr>' + cols.map(c => cellHtml(r, c[1])).join('') + '</tr>').join('');
    }
    function headerLabel(c){
      const arrow = sortState.key===c[1] ? (sortState.dir==='asc' ? ' ▲' : ' ▼') : '';
      return escapeHtml(c[0]) + arrow;
    }
    function renderThead(){
      return '<tr>' + cols.map(c => {
        const sortable = c[1] !== 'title';
        const cls = [c[1]!=='date'&&c[1]!=='title' ? 'num' : '', sortable ? 'sortable' : ''].filter(Boolean).join(' ');
        return `<th${cls?` class="${cls}"`:''}${sortable?` data-key="${c[1]}"`:''}>${headerLabel(c)}</th>`;
      }).join('') + '</tr>';
    }

    const lowSample = rows.length <= 4 ? ` · ⚠ solo ${rows.length} publicación${rows.length===1?'':'es'} en el rango — "destacada" acá puede ser simplemente la única disponible, no necesariamente un buen resultado` : '';
    card.innerHTML = `<h3>Publicaciones destacadas</h3><div class="cap">Top 8 del período por ${cols.find(c=>c[1]===defaultKey)[0].toLowerCase()}${lowSample} · hacé clic en una columna para ordenar</div>
      <div class="table-scroll"><table class="data-table"><thead>${renderThead()}</thead><tbody>${renderTbody()}</tbody></table></div>`;
    container.appendChild(card);

    const thead = card.querySelector('thead');
    const tbody = card.querySelector('tbody');
    function wireHeaders(){
      thead.querySelectorAll('th[data-key]').forEach(th => {
        th.addEventListener('click', () => {
          const key = th.getAttribute('data-key');
          if(sortState.key === key) sortState.dir = sortState.dir==='asc' ? 'desc' : 'asc';
          else { sortState.key = key; sortState.dir = 'desc'; }
          thead.innerHTML = renderThead();
          tbody.innerHTML = renderTbody();
          wireHeaders();
        });
      });
    }
    wireHeaders();
  }

    // indexed growth chart

    renderLineChart(card, [

  // ---------- generic sortable data table (used by the ads/analytics tabs) ----------
  // cols: [{ label, key, kind }] where kind is 'text' | 'int' | 'money' | 'pct'
  // opts.pageSizes: e.g. [10,25,50,'all'] — adds a row-count chip control so long
  // tables don't dump everything at once; opts.defaultPageSize picks the initial one.
  function sortableCard(title, caption, cols, rows, defaultKey, opts){
    opts = opts || {};
    const card = document.createElement('div');
    card.className = 'card';
    const sortState = { key: defaultKey, dir: 'desc' };
    const pageState = { size: opts.pageSizes ? (opts.defaultPageSize || opts.pageSizes[0]) : 'all' };

    function cellHtml(r, col){
      const v = r[col.key];
      if(col.kind==='text') return `<td class="content-cell">${escapeHtml(v==null||v===''?'—':String(v))}</td>`;
      if(col.kind==='money') return `<td class="num">${v==null?'—':'$'+fmtCompact(v)}</td>`;
      if(col.kind==='pct') return `<td class="num">${fmtPct(v)}</td>`;
      return `<td class="num">${fmtCompact(v)}</td>`;
    }
    function sortedRows(){
      const col = cols.find(c=>c.key===sortState.key);
      return rows.slice().sort((a,b)=>{
        const av = a[sortState.key], bv = b[sortState.key];
        if(col.kind==='text'){
          const as = av||'', bs = bv||'';
          return sortState.dir==='asc' ? as.localeCompare(bs) : bs.localeCompare(as);
        }
        const an = (av==null||Number.isNaN(av)) ? -Infinity : av, bn = (bv==null||Number.isNaN(bv)) ? -Infinity : bv;
        return sortState.dir==='asc' ? an-bn : bn-an;
      });
    }
    function visibleRows(){
      const sorted = sortedRows();
      return pageState.size==='all' ? sorted : sorted.slice(0, pageState.size);
    }
    function renderTbody(){
      return visibleRows().map(r => '<tr>' + cols.map(c => cellHtml(r, c)).join('') + '</tr>').join('');
    }
    function headerLabel(c){
      const arrow = sortState.key===c.key ? (sortState.dir==='asc' ? ' ▲' : ' ▼') : '';
      return escapeHtml(c.label) + arrow;
    }
    function renderThead(){
      return '<tr>' + cols.map(c => {
        const cls = [c.kind!=='text' ? 'num' : '', 'sortable'].filter(Boolean).join(' ');
        return `<th class="${cls}" data-key="${c.key}">${headerLabel(c)}</th>`;
      }).join('') + '</tr>';
    }
    function renderPager(){
      if(!opts.pageSizes) return '';
      const btns = opts.pageSizes.map(sz => {
        const label = sz==='all' ? 'Todas' : String(sz);
        return `<button class="chip${pageState.size===sz?' active':''}" data-size="${sz}">${label}</button>`;
      }).join('');
      return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:2px 0 10px">${btns}<span class="cap" style="margin:0">de ${rows.length} filas</span></div>`;
    }

    card.innerHTML = `<h3>${escapeHtml(title)}</h3><div class="cap">${escapeHtml(caption||'')}</div>
      <div class="pager">${renderPager()}</div>
      <div class="table-scroll"><table class="data-table"><thead>${renderThead()}</thead><tbody>${renderTbody()}</tbody></table></div>`;

    const thead = card.querySelector('thead');
    const tbody = card.querySelector('tbody');
    const pagerEl = card.querySelector('.pager');
    function wireHeaders(){
      thead.querySelectorAll('th[data-key]').forEach(th => {
        th.addEventListener('click', () => {
          const key = th.getAttribute('data-key');
          if(sortState.key === key) sortState.dir = sortState.dir==='asc' ? 'desc' : 'asc';
          else { sortState.key = key; sortState.dir = 'desc'; }
          thead.innerHTML = renderThead();
          tbody.innerHTML = renderTbody();
          wireHeaders();
        });
      });
    }
    function wirePager(){
      pagerEl.querySelectorAll('button[data-size]').forEach(btn => {
        btn.addEventListener('click', () => {
          const raw = btn.getAttribute('data-size');
          pageState.size = raw==='all' ? 'all' : Number(raw);
          pagerEl.innerHTML = renderPager();
          tbody.innerHTML = renderTbody();
          wirePager();
        });
      });
    }
    wireHeaders();
    wirePager();
    return card;
  }

  // ---------- google analytics tab ----------
  // GA4 Data API pull (scripts/fetch-ga4.js) — every underlying row is
  // day-granular, so it's filtered by the selected date range and
  // re-aggregated here, same as the network/web tabs. Rates (engagement,
  // bounce) are never summed/averaged directly — always recomputed from the
  // summed counts (sessions, engagedSessions) after filtering, since rates
  // aren't additive across rows.
  function fmtDuration(seconds){
    if(seconds==null||Number.isNaN(seconds)) return '—';
    const s = Math.round(seconds);
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }
  function groupSum(rows, keys, metrics){
    const map = new Map();
    rows.forEach(r => {
      const k = keys.map(f => r[f]).join('');
      let e = map.get(k);
      if(!e){ e = {}; keys.forEach(f => e[f] = r[f]); metrics.forEach(f => e[f] = 0); map.set(k, e); }
      metrics.forEach(f => { e[f] += (r[f]||0); });
    });
    return [...map.values()];
  }

  // source+medium table below already lists each outlet as its own row.

        { label:'Inversión', key:'spent', kind:'money' },
      ], rows, 'spent');
      card.classList.add('wide');
      cards.appendChild(card);
      content.appendChild(cards);
    }

    if(ads.googleKeywords && ads.googleKeywords.length){
      const rows = ads.googleKeywords.map(r => ({
        campaign: r.campaign, keyword: r.keyword, impressions: r.impressions, clicks: r.clicks,
        ctr: r.impressions ? r.clicks/r.impressions*100 : null,
        cost: r.cost,
      }));
      content.insertAdjacentHTML('beforeend', '<h3 style="font-size:13.5px;margin:16px 0 10px">[GAds-1] Google Ads — Palabras clave ' + periodBadge('desde inicio de campaña') + '</h3>');
      const cards = document.createElement('div'); cards.className='cards';
      const card = sortableCard('', `${rows.length} palabras clave con impresión en el período histórico · sin columna de conversiones (no hay acciones de conversión configuradas) · hacé clic en una columna para ordenar`, [
        { label:'Campaña', key:'campaign', kind:'text' },
        { label:'Palabra clave', key:'keyword', kind:'text' },
        { label:'Impresiones', key:'impressions', kind:'int' },
        { label:'Clics', key:'clicks', kind:'int' },
        { label:'CTR', key:'ctr', kind:'pct' },
        { label:'Costo', key:'cost', kind:'money' },
      ], rows, 'impressions',
        { pageSizes: [10,25,50,'all'], defaultPageSize: 25 });
      card.classList.add('wide');
      cards.appendChild(card);
      content.appendChild(cards);
    }

    const gm = ads.googleManual;
    if(gm && (gm.keywords?.length || gm.searchTerms?.length || gm.devices?.length || gm.landingPages?.length || gm.locations?.length)){
      content.insertAdjacentHTML('beforeend', '<h3 style="font-size:13.5px;margin:24px 0 4px">Google Ads — Datos ampliados ' + periodBadge('últimos 12 meses') + '</h3><div class="cap" style="margin-bottom:12px"><strong>Datos de los últimos 12 meses</strong> (29 jul 2025 – 25 ago 2026), exportados manualmente desde Google Ads (no vía API) — es un total acumulado de ese período, no varía con el selector de fechas de arriba. Se actualiza volviendo a exportar, no en vivo.</div>');
      const gmCards = document.createElement('div'); gmCards.className='cards';

      if(gm.keywords && gm.keywords.length){
        const rows = gm.keywords.map(r => ({ keyword: r.keyword, matchType: r.matchType, clicks: r.clicks, ctr: r.ctr, cost: r.cost }));
        const card = sortableCard('[GAds-1, GAds-2] Palabras clave — tipo de coincidencia', `${rows.length} palabras clave · hacé clic en una columna para ordenar`, [
          { label:'Palabra clave', key:'keyword', kind:'text' },
          { label:'Tipo de coincidencia', key:'matchType', kind:'text' },
          { label:'Clics', key:'clicks', kind:'int' },
          { label:'CTR', key:'ctr', kind:'pct' },
          { label:'Costo', key:'cost', kind:'money' },
        ], rows, 'cost', { pageSizes: [10,25,50,'all'], defaultPageSize: 25 });
        card.classList.add('wide');
        gmCards.appendChild(card);
      }

      if(gm.searchTerms && gm.searchTerms.length){
        const card = sortableCard('[GAds-4] Búsquedas reales que activaron los anuncios', `${gm.searchTerms.length} búsquedas · sin columna de conversiones (no hay acciones de conversión configuradas) · hacé clic en una columna para ordenar`, [
          { label:'Búsqueda', key:'searchTerm', kind:'text' },
          { label:'Impresiones', key:'impressions', kind:'int' },
          { label:'Clics', key:'clicks', kind:'int' },
          { label:'Costo', key:'cost', kind:'money' },
        ], gm.searchTerms, 'impressions', { pageSizes: [10,25,50,'all'], defaultPageSize: 25 });
        card.classList.add('wide');
        gmCards.appendChild(card);
      }

      if(gm.devices && gm.devices.length){
        const card = sortableCard('[GAds-8c] Dispositivos', 'Por campaña y dispositivo · hacé clic en una columna para ordenar', [
          { label:'Dispositivo', key:'device', kind:'text' },
          { label:'Campaña', key:'campaign', kind:'text' },
          { label:'Impresiones', key:'impressions', kind:'int' },
          { label:'Interacciones', key:'interactions', kind:'int' },
          { label:'% Interacción', key:'interactionRate', kind:'pct' },
          { label:'Costo', key:'cost', kind:'money' },
        ], gm.devices, 'impressions');
        card.classList.add('wide');
        gmCards.appendChild(card);
      }

      if(gm.landingPages && gm.landingPages.length){
        const card = sortableCard('[GAds-8d] Páginas de destino', 'Rendimiento por página de destino · hacé clic en una columna para ordenar', [
          { label:'Página', key:'landingPage', kind:'text' },
          { label:'Clics', key:'clicks', kind:'int' },
          { label:'Impresiones', key:'impressions', kind:'int' },
          { label:'CTR', key:'ctr', kind:'pct' },
          { label:'Costo', key:'cost', kind:'money' },
        ], gm.landingPages, 'impressions');
        card.classList.add('wide');
        gmCards.appendChild(card);
      }

      if(gm.locations && gm.locations.length){
        const card = sortableCard('[GAds-8b] Ubicaciones', `${gm.locations.length} ubicación × campaña · sin columna de conversiones (no hay acciones de conversión configuradas) · hacé clic en una columna para ordenar`, [
          { label:'Ubicación', key:'location', kind:'text' },
          { label:'Campaña', key:'campaign', kind:'text' },
          { label:'Clics', key:'clicks', kind:'int' },
          { label:'Impresiones', key:'impressions', kind:'int' },
          { label:'CTR', key:'ctr', kind:'pct' },
          { label:'Costo', key:'cost', kind:'money' },
        ], gm.locations, 'impressions', { pageSizes: [10,25,50,'all'], defaultPageSize: 25 });
        card.classList.add('wide');
        gmCards.appendChild(card);
      }

      content.appendChild(gmCards);
    }

    const mm = ads.metaManual;
    if(mm && mm.campaigns?.length){
      content.insertAdjacentHTML('beforeend', '<h3 style="font-size:13.5px;margin:24px 0 4px">Meta Ads — Datos ampliados ' + periodBadge('últimos 12 meses') + '</h3><div class="cap" style="margin-bottom:12px"><strong>Datos de los últimos 12 meses</strong> (25 ago 2025 – 25 ago 2026), exportados manualmente desde Meta Ads Manager (no vía API) — es un total acumulado de ese período, no varía con el selector de fechas de arriba. Se actualiza volviendo a exportar, no en vivo. "Presupuesto" muestra texto en vez de un número en la tabla de campañas porque esta cuenta lo define a nivel de conjunto de anuncios, no de campaña — el número real está en la tabla "Plataformas y ubicaciones".</div>');
      const mmCards = document.createElement('div'); mmCards.className='cards';
      const rows = mm.campaigns.map(r => ({
        name: r.name, objective: r.objective, resultIndicator: r.resultIndicator, results: r.results,
        reach: r.reach, frequency: r.frequency, costPerResult: r.costPerResult, budgetInfo: r.budgetInfo,
        amountSpent: r.amountSpent, impressions: r.impressions, linkClicks: r.linkClicks, allClicks: r.allClicks,
        landingPageViews: r.landingPageViews,
      }));
      const card = sortableCard('[Meta-1, Meta-5, Meta-7] Campañas — detalle', 'Objetivo, resultados, alcance, frecuencia, presupuesto y clics por campaña · hacé clic en una columna para ordenar', [
        { label:'Campaña', key:'name', kind:'text' },
        { label:'Objetivo', key:'objective', kind:'text' },
        { label:'Indicador de resultado', key:'resultIndicator', kind:'text' },
        { label:'Resultados', key:'results', kind:'int' },
        { label:'Alcance', key:'reach', kind:'int' },
        { label:'Frecuencia', key:'frequency', kind:'pct' },
        { label:'Costo por resultado', key:'costPerResult', kind:'money' },
        { label:'Presupuesto', key:'budgetInfo', kind:'text' },
        { label:'Gasto', key:'amountSpent', kind:'money' },
        { label:'Impresiones', key:'impressions', kind:'int' },
        { label:'Clics en el enlace', key:'linkClicks', kind:'int' },
        { label:'Clics (todos)', key:'allClicks', kind:'int' },
        { label:'Visitas a landing', key:'landingPageViews', kind:'int' },
      ], rows, 'amountSpent');
      card.classList.add('wide');
      mmCards.appendChild(card);
      content.appendChild(mmCards);
    }

    if(mm && mm.audiences?.length){
      const cards = document.createElement('div'); cards.className='cards';
      const card = sortableCard('[Meta-2] Públicos alcanzados — edad y sexo', `${mm.audiences.length} filas (campaña × edad × sexo) · hacé clic en una columna para ordenar`, [
        { label:'Campaña', key:'campaign', kind:'text' },
        { label:'Edad', key:'age', kind:'text' },
        { label:'Sexo', key:'gender', kind:'text' },
        { label:'Alcance', key:'reach', kind:'int' },
        { label:'Impresiones', key:'impressions', kind:'int' },
        { label:'Clics en el enlace', key:'linkClicks', kind:'int' },
      ], mm.audiences, 'reach', { pageSizes: [10,25,50,'all'], defaultPageSize: 25 });
      card.classList.add('wide');
      cards.appendChild(card);
      content.appendChild(cards);
    }

    if(mm && mm.placements?.length){
      const cards = document.createElement('div'); cards.className='cards';
      const card = sortableCard('[Meta-1, Meta-3] Plataformas y ubicaciones', `${mm.placements.length} filas (conjunto de anuncios × plataforma × ubicación × dispositivo) · presupuesto y gasto reales, a nivel conjunto de anuncios · hacé clic en una columna para ordenar`, [
        { label:'Conjunto de anuncios', key:'adSet', kind:'text' },
        { label:'Plataforma', key:'platform', kind:'text' },
        { label:'Ubicación', key:'placement', kind:'text' },
        { label:'Dispositivo', key:'devicePlatform', kind:'text' },
        { label:'Alcance', key:'reach', kind:'int' },
        { label:'Impresiones', key:'impressions', kind:'int' },
        { label:'Presupuesto', key:'budget', kind:'money' },
        { label:'Gasto', key:'amountSpent', kind:'money' },
        { label:'Clics en el enlace', key:'linkClicks', kind:'int' },
      ], mm.placements, 'reach', { pageSizes: [10,25,50,'all'], defaultPageSize: 25 });
      card.classList.add('wide');
      cards.appendChild(card);
      content.appendChild(cards);
    }

    if(mm && mm.video?.length){
      const rows = mm.video.map(r => ({ ...r, avgWatchTime: fmtDuration(r.avgWatchTimeSec) }));
      const cards = document.createElement('div'); cards.className='cards';
      const card = sortableCard('[Meta-5, Meta-6] Reproducciones y tiempo de visualización', `${rows.length} anuncios · presupuesto real a nivel conjunto de anuncios · hacé clic en una columna para ordenar`, [
        { label:'Anuncio', key:'adName', kind:'text' },
        { label:'Estado', key:'delivery', kind:'text' },
        { label:'Alcance', key:'reach', kind:'int' },
        { label:'Frecuencia', key:'frequency', kind:'pct' },
        { label:'Presupuesto', key:'budget', kind:'money' },
        { label:'Reproducciones', key:'videoPlays', kind:'int' },
        { label:'ThruPlays', key:'thruPlays', kind:'int' },
        { label:'Tiempo prom.', key:'avgWatchTime', kind:'text' },
      ], rows, 'videoPlays', { pageSizes: [10,25,50,'all'], defaultPageSize: 25 });
      card.classList.add('wide');
      cards.appendChild(card);
      content.appendChild(cards);
    }

    content.insertAdjacentHTML('beforeend', '<div class="cap" style="margin-top:16px">Todavía no incluye: palabras clave excluidas, % de impresión de búsqueda / pérdida de visibilidad, ni públicos (Google Ads) — ni destino de cada anuncio (Meta Ads: el export de Ads Manager no trajo columna de URL/destino, hay que revisar si existe con otro nombre y volver a exportar). Esos datos requieren exportaciones manuales adicionales desde cada plataforma.</div>');
  }

  function renderAll(){
    renderFilterBar();
    renderTabs();
    const content = document.getElementById('content');
    content.innerHTML = '';
    document.getElementById('meta-info').innerHTML =
      'Rango: ' + escapeHtml(fmtDateLong(state.from)) + ' – ' + escapeHtml(fmtDateLong(state.to)) +
      ' · <strong style="color:var(--text-primary)">Datos de redes hasta: ' + escapeHtml(fmtDateLong(MAX_DATE)) + '</strong>' +
      ' · Panel armado el: ' + escapeHtml(new Date(DATA.meta.generatedAt).toLocaleString('es-AR'));
    if(state.tab==='overview') renderOverview();
    else if(state.tab==='web') renderWeb();
    else renderNetwork(state.tab);
  }

  renderAll();
})();
</script>
</body>
</html>
